# agterm-scoped ghostty config (~/.config/agterm/ghostty.conf). Applies only to agterm.
# Settings agterm emits from its own Settings UI (theme, scroll, paste) load after this and win.

# Font: same as ~/.config/ghostty/config and VS Code.
font-family = Monaco
font-size = 15

# Block cursor: the thin bar is hard to spot. Rest same as ~/.config/ghostty/config
cursor-style = block
cursor-style-blink = false
# Ghostty shell integration resets the cursor to a bar at the prompt; keep the block.
shell-integration-features = no-cursor
macos-option-as-alt = false
scrollback-limit = 52428800
mouse-hide-while-typing = true
bell-features = system, attention, title
confirm-close-surface = true

# merl's seneca themes (agterm/themes, linked to ~/.config/agterm/themes). agterm's own theme setting
# stays "default ghostty" (agtermctl theme set), or it would override this line.
theme = /Users/mburtsev/.config/agterm/themes/seneca-light
# agterm reads selection colours only from bundled themes, so a theme by path leaves the
# selected sidebar row white on white; repeat seneca-light's here.
selection-background = #d5d2c9
selection-foreground = #000000

# Light theme: opaque background reads better than the dark-theme 0.947.
background-opacity = 1
