# agterm-scoped ghostty config (~/.config/agterm/ghostty.conf). Applies only to agterm.
# Settings agterm emits from its own Settings UI (theme, scroll, paste) load after this and win.

# Font: match Claude Desktop (ui-monospace = SF Mono, ~14px).
font-family = SF Mono
font-size = 16

# Same as ~/.config/ghostty/config
cursor-style = bar
cursor-style-blink = false
macos-option-as-alt = false
scrollback-limit = 52428800
mouse-hide-while-typing = true
bell-features = system, attention, title
confirm-close-surface = true

# Light theme: opaque background reads better than the dark-theme 0.947.
background-opacity = 1
