# agterm keymap (~/.config/agterm/keymap.conf). Reload: agtermctl keymap reload.
# Reference for verbs and built-in action names: agtermctl keymap --help

# Same chords as in ~/.config/ghostty/config
map cmd+return                 toggle_fullscreen
map ctrl+opt+left              focus_left_pane
map ctrl+opt+right             focus_right_pane
map cmd+shift+e                toggle_horizontal_split

# Same as VS Code
map cmd+b                      toggle_sidebar
