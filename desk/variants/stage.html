<!doctype html>
<html lang="en">

<style>
:root {
  --room: #171824; --bg: #1e2030; --bg2: #222436; --raise: #2a2d45;
  --line: #2f334d; --line2: #3b4261;
  --fg: #c8d3f5; --fg2: #a9b4dc; --mute: #737aa2; --faint: #545c7e;
  --blue: #82aaff; --green: #c3e88d; --red: #ff757f; --yellow: #ffc777;
  --green-soft: rgb(195 232 141 / .12); --red-soft: rgb(255 117 127 / .12);
  --shade: rgb(8 9 16 / .55);
  --ease: cubic-bezier(.16, 1, .3, 1);
  --panel: clamp(360px, 24vw, 640px);
  --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --room: #f2f3f7; --bg: #ffffff; --bg2: #f7f7fa; --raise: #e9eaf0;
    --line: #e4e5ec; --line2: #d0d3e0;
    --fg: #343b58; --fg2: #4c5683; --mute: #6c74a0; --faint: #a1a6c5;
    --blue: #2e7de9; --green: #587539; --red: #e0245e; --yellow: #8c6c3e;
    --green-soft: rgb(88 117 57 / .1); --red-soft: rgb(224 36 94 / .08);
    --shade: rgb(52 59 88 / .18);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { font-size: 16px; }
@media (min-width: 1800px) and (min-height: 1000px) { html { font-size: 18.5px; } }
body { background: var(--bg); color: var(--fg); font: 0.9375rem/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
kbd { font: 500 0.75rem/1 var(--mono); padding: 3px 6px 4px; border-radius: 5px; border: 1px solid var(--line2); border-bottom-width: 2px; color: var(--fg2); background: var(--bg2); white-space: nowrap; }
code { font: 500 .9em/1 var(--mono); padding: .1em .35em; border-radius: 5px; background: var(--raise); color: var(--fg); overflow-wrap: anywhere; }

.app { height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "head head" "stage panel" "strip panel"; }

/* header */
.head { grid-area: head; display: flex; align-items: center; gap: 18px; padding: 12px 24px; background: var(--room); border-bottom: 1px solid var(--line); min-width: 0; }
.qbtn { display: flex; align-items: center; gap: 10px; height: 2.3rem; padding: 0 12px 0 10px; border-radius: 8px; color: var(--fg2); box-shadow: inset 0 0 0 1px var(--line2); font: 500 0.8125rem/1 var(--mono); flex: none; transition: background .2s; }
.qbtn:hover { background: var(--bg2); }
.qbtn i { font-size: 1.0625rem; }
.navb { width: 36px; height: 36px; border-radius: 8px; display: none; place-items: center; font-size: 1.125rem; color: var(--fg2); flex: none; }
.navb:disabled { opacity: .3; }
.titlebox { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 14px; }
.titlebox .tag { font: 500 0.8125rem/1 var(--mono); color: var(--mute); flex: none; }
.titlebox h1 { margin: 0; font-size: 1.1875rem; font-weight: 550; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebox.swap h1, .titlebox.swap .tag { animation: rise .5s var(--ease) both; }
.ticks { display: flex; gap: 3px; align-items: center; flex: none; }
.ticks button { width: 5px; height: 14px; border-radius: 2px; background: var(--line2); transition: height .3s var(--ease), background .3s; }
.ticks button.done { background: var(--green); opacity: .7; }
.ticks button.later { background: var(--yellow); opacity: .75; }
.ticks button.text { background: var(--blue); opacity: .7; }
.ticks button.cur { height: 24px; opacity: 1; box-shadow: 0 0 0 1px var(--fg); }
.waitc { font: 500 0.8125rem/1 var(--mono); color: var(--mute); flex: none; min-width: 9ch; text-align: right; }
.waitc.done { color: var(--green); }

/* stage */
.stage { grid-area: stage; position: relative; background: var(--room); container-type: size; overflow: hidden; --pad: 40px; --sub: 52px; }
.layer { position: absolute; inset: 0 0 var(--sub); display: grid; place-items: center; padding: var(--pad); }
.layer::before { content: ''; position: absolute; inset: 8%; background: var(--glow, none) center / cover; filter: blur(90px) saturate(1.3); opacity: .22; pointer-events: none; }
@media (prefers-color-scheme: light) { .layer::before { opacity: .12; } }
.layer > * { position: relative; }
.layer.enter { animation: fadein .32s var(--ease) both; }
.layer.enter.reel { animation: reelin .62s var(--ease) both; }
.layer.leave { animation: fadeout .26s ease both; pointer-events: none; }
.layer.leave.reel { animation: reelout .22s ease both; }
.frame { position: relative; aspect-ratio: var(--ar, 1.7778); width: min(calc(100cqw - 2 * var(--pad)), calc((100cqh - var(--sub) - 2 * var(--pad)) * var(--ar, 1.7778))); border-radius: 8px; background: var(--bg2); box-shadow: 0 30px 80px -30px var(--shade), 0 0 0 1px var(--line); transition: box-shadow .4s var(--ease); cursor: pointer; }
.frame > img, .frame > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; border-radius: 8px; display: block; }
.frame > video { background: var(--bg2); }
.frame.picked { box-shadow: 0 30px 80px -30px var(--shade), 0 0 0 2px var(--green); }
.frame .ink { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); pointer-events: none; overflow: visible; }
.frame .ink rect { fill: none; stroke: var(--green); stroke-width: 3; stroke-dasharray: 100 100; stroke-dashoffset: 100; vector-effect: non-scaling-stroke; }
.frame .ink.draw rect { animation: ink .9s var(--ease) forwards; }
.frame.wipe { cursor: ew-resize; touch-action: pan-y; }
.frame.wipe .top { clip-path: inset(0 0 0 var(--x, 50%)); }
.frame.wipe .top.swap { animation: fadein .3s ease both; }
.divider { position: absolute; top: -10px; bottom: -10px; left: var(--x, 50%); width: 2px; margin-left: -1px; background: var(--fg); box-shadow: 0 0 0 1px var(--shade); pointer-events: none; }
.divider .grip { position: absolute; top: 50%; left: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: var(--fg); color: var(--room); display: grid; place-items: center; font-size: 0.875rem; box-shadow: 0 6px 20px var(--shade); }
.frame.sweep { --x: 100%; }
.frame.wipe:not(.drag) .top, .frame.wipe:not(.drag) .divider { transition: clip-path .7s var(--ease), left .7s var(--ease); }
.vfail { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; background: var(--bg2); border-radius: 8px; color: var(--fg2); text-align: center; padding: 20px; }
.vfail i { font-size: 1.75rem; color: var(--mute); }

.slate { width: min(100%, 980px); display: grid; gap: 22px; align-content: center; }
.slate .sk { font: 600 0.9375rem/1 var(--mono); display: flex; align-items: center; gap: 12px; color: var(--mute); }
.slate .sk b { font-size: 1.375rem; width: 46px; height: 46px; border-radius: 8px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line2); color: var(--fg); }
.slate.rec .sk b { color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.slate h2 { margin: 0; font-size: clamp(1.5rem, 2.4cqw, 44px); line-height: 1.15; font-weight: 550; letter-spacing: -.02em; text-wrap: balance; }
.slate p { margin: 0; font-size: clamp(1rem, 1.25cqw, 22px); line-height: 1.55; color: var(--fg2); max-width: 62ch; text-wrap: pretty; }
.slate .nr { font: 500 0.8125rem/1 var(--mono); color: var(--faint); }

.sub { position: absolute; left: 0; right: 0; bottom: 0; height: var(--sub); display: flex; align-items: center; gap: 14px; padding: 0 var(--pad) 10px; font-size: 0.875rem; min-width: 0; }
.sub .cap { font: 600 0.8125rem/1 var(--mono); height: 26px; min-width: 26px; padding: 0 7px; border-radius: 6px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line2); flex: none; }
.cap.now { color: var(--red); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--red) 55%, transparent); }
.cap.rec { color: var(--green); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--green) 55%, transparent); }
.sub .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg2); min-width: 0; }
.sub .vs { color: var(--mute); flex: none; font: 500 0.75rem/1 var(--mono); }
.sub .flag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; flex: none; }
.flag.rec { color: var(--green); }
.flag.picked { color: var(--green); font-weight: 600; animation: rise .5s var(--ease) both; }
.sub .grow { flex: 1; }
.prog { flex: 0 1 360px; height: 18px; display: flex; align-items: center; cursor: pointer; min-width: 60px; }
.prog span { width: 100%; height: 3px; border-radius: 2px; background: var(--line2); overflow: hidden; }
.prog span i { display: block; height: 100%; width: 100%; background: var(--fg); transform-origin: left; transform: scaleX(var(--p, 0)); }
.tc { font: 500 0.75rem/1 var(--mono); color: var(--mute); flex: none; min-width: 9ch; text-align: right; }

/* strip */
.strip { grid-area: strip; background: var(--room); border-top: 1px solid var(--line); display: flex; align-items: stretch; gap: 20px; padding: 14px 24px 16px; min-width: 0; }
.track { position: relative; display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; min-width: 0; flex: 1; }
.track::-webkit-scrollbar { display: none; }
.thumb { flex: none; width: 12rem; display: grid; gap: 8px; text-align: left; opacity: .62; transition: opacity .3s, transform .3s var(--ease); }
.thumb:hover { opacity: .9; }
.thumb.on { opacity: 1; }
.thumb.mute { opacity: .32; }
.thumb .shot { position: relative; height: 7rem; border-radius: 8px; background: var(--bg2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; display: grid; place-items: center; transition: box-shadow .3s; }
.thumb .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb .shot .sl { font: 600 1.625rem/1 var(--mono); color: var(--faint); }
.thumb.picked .shot { box-shadow: inset 0 0 0 2px var(--green); }
.thumb .lab { display: flex; align-items: center; gap: 7px; font-size: 0.8125rem; min-width: 0; }
.thumb .lab .k { font: 600 0.75rem/1 var(--mono); flex: none; color: var(--fg2); }
.thumb.now .lab .k { color: var(--red); }
.thumb.rec .lab .k { color: var(--green); }
.thumb .lab .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg2); min-width: 0; flex: 1; }
.thumb .lab .ok { color: var(--green); font-size: 0.875rem; flex: none; display: none; }
.thumb.picked .lab .ok { display: block; animation: pop .45s var(--ease) both; }
.thumb .lab .st { color: var(--green); font-size: 0.75rem; flex: none; }
.playhead { position: absolute; left: 0; bottom: 0; height: 2px; border-radius: 2px; background: var(--fg); transition: transform .45s var(--ease), width .45s var(--ease); pointer-events: none; }
.tools { display: flex; flex-direction: column; justify-content: center; gap: 8px; flex: none; width: 10.5rem; }
.tool { display: flex; align-items: center; gap: 10px; white-space: nowrap; height: 2.4rem; padding: 0 10px 0 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line2); color: var(--fg2); font-size: 0.8125rem; transition: background .2s, color .2s, transform .1s; }
.tool:hover:not(:disabled) { background: var(--bg2); color: var(--fg); }
.tool:active:not(:disabled) { transform: scale(.98); }
.tool:disabled { opacity: .35; cursor: default; }
.tool[aria-pressed="true"] { background: var(--fg); color: var(--room); box-shadow: none; }
.tool[aria-pressed="true"] kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--room) 40%, transparent); }
.tool i { font-size: 1rem; }
.tool kbd { margin-left: auto; }

/* panel */
.panel { grid-area: panel; display: grid; grid-template-rows: minmax(0, 1fr) auto; border-left: 1px solid var(--line); background: var(--bg); min-height: 0; }
.scroll { overflow-y: auto; padding: 28px 30px 24px; display: grid; gap: 26px; align-content: start; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8125rem; line-height: 1.45; color: var(--mute); }
.meta a { font: 500 0.7812rem/1.45 var(--mono); }
.today { margin: 10px 0 0; color: var(--fg2); font-size: 1rem; text-wrap: pretty; }
.lbl { font-size: 0.8125rem; font-weight: 600; color: var(--mute); margin: 0 0 6px; letter-spacing: .01em; }
.take { display: grid; gap: 16px; }
.take.swap { animation: rise .4s var(--ease) both; }
.take h2 { margin: 0; font-size: 1.3125rem; line-height: 1.25; font-weight: 600; letter-spacing: -.015em; display: flex; gap: 12px; align-items: flex-start; }
.take h2 .cap { font: 600 0.875rem/1 var(--mono); height: 28px; min-width: 28px; padding: 0 7px; border-radius: 6px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line2); flex: none; margin-top: -1px; }
.take p { margin: 0; text-wrap: pretty; }
.take .rule { font-size: 1.0625rem; line-height: 1.55; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pair > div { padding-top: 12px; border-top: 1px solid var(--line); font-size: 0.9375rem; color: var(--fg2); }
.pair .lbl.adds { color: var(--green); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.7812rem; font-weight: 600; color: var(--green); }
.facts { display: grid; gap: 18px; padding-top: 22px; border-top: 1px solid var(--line); }
.facts p { margin: 0; font-size: 0.9375rem; color: var(--fg2); text-wrap: pretty; }

.dock { border-top: 1px solid var(--line); padding: 16px 30px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 12px; background: var(--bg); }
.drow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 2.5rem; padding: 0 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line2); font-size: 0.875rem; font-weight: 500; white-space: nowrap; transition: background .2s, color .2s, transform .1s, box-shadow .2s; }
.btn:hover { background: var(--bg2); }
.btn:active { transform: scale(.98); }
.btn i { font-size: 1rem; }
.btn.go { color: var(--green); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--green) 50%, transparent); }
.btn.go.on { background: var(--green-soft); }
.btn[aria-pressed="true"] { color: var(--yellow); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--yellow) 55%, transparent); }
.btn.next { margin-left: auto; }
.saved { font-size: 0.7812rem; color: var(--mute); display: inline-flex; align-items: center; gap: 6px; min-height: 20px; }
.saved.ok { color: var(--fg2); }
.saved.ok i { color: var(--green); }
.saved.err { color: var(--red); }
.saved .ph-circle-notch { animation: spin 1s linear infinite; }
.notewrap { display: grid; gap: 6px; }
.notewrap label { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 600; color: var(--mute); }
textarea { width: 100%; resize: none; min-height: 44px; max-height: 30vh; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg2); color: var(--fg); font: 0.9375rem/1.5 var(--sans); transition: border-color .2s; }
textarea::placeholder { color: var(--mute); }
textarea:focus { outline: none; border-color: var(--blue); }

/* queue drawer */
.drawer { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.drawer .scrim { position: absolute; inset: 0; background: var(--shade); opacity: 0; transition: opacity .3s; }
.drawer aside { position: absolute; inset: 0 auto 0 0; width: min(460px, 92vw); background: var(--bg); border-right: 1px solid var(--line); transform: translateX(-102%); transition: transform .45s var(--ease); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; box-shadow: 0 0 60px var(--shade); }
.drawer.open { pointer-events: auto; }
.drawer.open .scrim { opacity: 1; }
.drawer.open aside { transform: none; }
.drawer header { padding: 20px 22px 12px; display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
.drawer header span { font: 500 0.7812rem/1 var(--mono); color: var(--mute); }
.qlist { overflow-y: auto; padding: 0 10px 10px; }
.qi { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 12px; border-radius: 8px; text-align: left; transition: background .15s; }
.qi:hover { background: var(--bg2); }
.qi.cur { background: var(--raise); }
.qi .t { font-size: 0.875rem; line-height: 1.35; grid-column: 1; }
.qi .g { font: 500 0.7188rem/1.3 var(--mono); color: var(--mute); grid-column: 1; }
.qi .c { grid-column: 2; grid-row: 1 / 3; align-self: center; font: 500 0.75rem/1 var(--mono); color: var(--faint); }
.qi .c.pick { color: var(--green); }
.qi .c.later { color: var(--yellow); }
.qi .c.text { color: var(--blue); }
.dfoot { padding: 14px 22px 20px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.broken { color: var(--red); font-size: 0.8125rem; white-space: pre-line; }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 0.8125rem; color: var(--fg2); align-items: center; }
.legend > span:nth-child(odd) { display: flex; gap: 4px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, calc(100% + 40px)); visibility: hidden; z-index: 6; background: var(--raise); color: var(--fg); padding: 10px 16px; border-radius: 8px; font-size: 0.875rem; display: flex; gap: 8px; align-items: center; transition: transform .4s var(--ease); box-shadow: 0 10px 40px var(--shade); }
.toast.on { transform: translate(-50%, 0); visibility: visible; }
.toast i { color: var(--red); }

.skel { position: absolute; inset: 40px 40px 92px; border-radius: 8px; background: linear-gradient(100deg, var(--bg2) 30%, var(--raise) 50%, var(--bg2) 70%) 0 0 / 300% 100%; animation: shimmer 1.6s linear infinite; }

@keyframes fadein { from { opacity: 0; transform: scale(1.012); } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes reelin { 0% { opacity: 0; transform: translateY(14px) scale(.985); } 30% { opacity: 0; } }
@keyframes reelout { to { opacity: 0; transform: scale(.985); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes ink { 0% { stroke-dashoffset: 100; opacity: 1; } 70% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes shimmer { to { background-position: -300% 0; } }

@media (max-width: 1100px) {
  :root { --panel: 340px; }
  .ticks { display: none; }
}
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto; grid-template-areas: "head" "stage" "strip" "panel"; }
  .head { position: sticky; top: 0; z-index: 3; flex-wrap: wrap; gap: 8px 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 12px; }
  .navb { display: grid; }
  .qbtn { order: 2; margin: 0 auto; }
  #prev { order: 1; } #next { order: 3; }
  .waitc { display: none; }
  .titlebox { order: 4; flex-basis: 100%; flex-direction: column; gap: 4px; }
  .titlebox h1 { white-space: normal; font-size: 1.0625rem; line-height: 1.3; }
  .stage { --pad: 16px; --sub: 46px; height: clamp(150px, calc((100vw - 32px) / var(--sar, 1.6) + 32px + var(--sub)), 70svh); }
  .sub { padding: 0 16px 8px; gap: 10px; }
  .sub .vs, .prog { display: none; }
  .strip { padding: 12px 0 12px 16px; flex-direction: column; gap: 10px; }
  .track { padding-right: 16px; }
  .thumb { width: 132px; }
  .thumb .shot { height: 80px; }
  .tools { flex-direction: row; padding-right: 16px; width: auto; }
  .tool { flex: 1; justify-content: center; }
  .tool kbd { display: none; }
  .panel { border-left: 0; display: block; }
  .scroll { padding: 22px 16px; overflow: visible; }
  .pair { grid-template-columns: 1fr; }
  .dock { position: sticky; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px -12px var(--shade); }
  .btn kbd { display: none; }
  .divider .grip { width: 40px; height: 40px; margin: -20px 0 0 -20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  .frame .ink { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="head">
    <button class="navb" id="prev" type="button" aria-label="Previous question"><i class="ph ph-caret-left"></i></button>
    <button class="qbtn" id="qbtn" type="button" aria-label="Open the queue"><i class="ph ph-list"></i><span id="pos">0 / 0</span></button>
    <button class="navb" id="next" type="button" aria-label="Next question"><i class="ph ph-caret-right"></i></button>
    <div class="titlebox" id="titlebox"><span class="tag" id="tag"></span><h1 id="title">Loading</h1></div>
    <nav class="ticks" id="ticks" aria-label="Questions"></nav>
    <span class="waitc" id="waitc"></span>
  </header>
  <section class="stage" id="stage" aria-label="Stage"><div class="skel"></div><div class="sub" id="sub"></div></section>
  <footer class="strip">
    <div class="track" id="track" role="tablist" aria-label="Takes"><div class="playhead" id="playhead"></div></div>
    <div class="tools">
      <button class="tool" id="wipeBtn" type="button" aria-pressed="false"><i class="ph ph-split-horizontal"></i>Compare<kbd>W</kbd></button>
      <button class="tool" id="playBtn" type="button"><i class="ph ph-play"></i><span>Play</span><kbd>Space</kbd></button>
    </div>
  </footer>
  <aside class="panel">
    <div class="scroll" id="scroll"></div>
    <div class="dock" id="dock"></div>
  </aside>
</div>
<div class="drawer" id="drawer">
  <div class="scrim" id="scrim"></div>
  <aside aria-label="Queue">
    <header>Queue<span id="dcount"></span></header>
    <nav class="qlist" id="qlist"></nav>
    <div class="dfoot">
      <div class="broken" id="broken" hidden></div>
      <div class="legend">
        <span><kbd>←</kbd><kbd>→</kbd></span><span>Previous or next take</span>
        <span><kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd></span><span>Pick a take</span>
        <span><kbd>R</kbd></span><span>Pick the recommended</span>
        <span><kbd>W</kbd><kbd>Shift ← →</kbd></span><span>Compare with now, move the line</span>
        <span><kbd>Space</kbd></span><span>Play the screencast</span>
        <span><kbd>L</kbd></span><span>Park</span>
        <span><kbd>N</kbd><kbd>Esc</kbd></span><span>Write a note, leave it</span>
        <span><kbd>J</kbd><kbd>K</kbd></span><span>Next or previous question</span>
      </div>
    </div>
  </aside>
</div>
<div class="toast" id="toast"><i class="ph ph-wifi-slash"></i>No connection to the desk, retrying</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}
const icon = (name, fill) => h('i', { class: (fill ? 'ph-fill ph-' : 'ph ph-') + name, 'aria-hidden': 'true' });
const arr = v => Array.isArray(v) ? v : [];
const str = v => typeof v === 'string' ? v : v == null ? '' : String(v);
const fmt = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const answered = a => !!a && (a.status === 'later' || arr(a.pick).length > 0 || !!str(a.note).trim());
const time = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const rich = t => str(t).split(/(`[^`]+`)/).map(p => p.length > 2 && p[0] === '`' && p.at(-1) === '`' ? h('code', { text: p.slice(1, -1) }) : p);

const S = { cards: [], byId: {}, answers: {}, broken: [], cur: null, etag: null, qSig: '', shownSig: null, loaded: false,
  refs: null, timers: {}, pending: {}, seq: {}, saveState: {}, view: {}, ar: {}, wipe: false, x: 50, video: null };

function takesOf(c) {
  const t = [];
  if (c.now && typeof c.now === 'object') t.push({ kind: 'now', key: 'Now', name: 'Now', m: c.now });
  for (const o of arr(c.options)) if (o && typeof o === 'object') t.push({ kind: 'opt', key: str(o.key), name: str(o.name) || 'Option ' + o.key, m: o, rec: !!o.rec });
  if (c.result && typeof c.result === 'object') t.push({ kind: 'result', key: 'End', name: str(c.result.title) || 'Result', m: c.result });
  return t;
}
const hasMedia = m => !!(m && (m.img || m.video));
const card = () => S.byId[S.cur];
const takes = () => S.refs?.takes || [];
const tIdx = () => S.view[S.cur] ?? 0;
const take = () => takes()[tIdx()];
const nowImg = () => card()?.now?.img;
const canWipe = t => !!(t && t.kind !== 'now' && t.m.img && nowImg());

/* data */
function setOnline(ok) { $('#toast').classList.toggle('on', !ok); }
async function poll() {
  try {
    const r = await fetch('api/state', { headers: S.etag ? { 'If-None-Match': S.etag } : {}, cache: 'no-store' });
    if (r.status !== 304 && !r.ok) throw new Error(r.status);
    setOnline(true);
    for (const id of Object.keys(S.saveState)) if (S.saveState[id] === 'error') send(id);
    if (r.status === 304) return;
    S.etag = r.headers.get('ETag');
    apply(await r.json());
  } catch { setOnline(false); }
}
function apply(d) {
  S.cards = arr(d.cards).filter(c => c && c.id);
  S.byId = Object.fromEntries(S.cards.map(c => [c.id, c]));
  S.broken = arr(d.broken);
  for (const [id, a] of Object.entries(d.answers || {})) if (!S.pending[id] && !S.timers[id]) S.answers[id] = a;
  if (!S.loaded || !S.byId[S.cur]) {
    const fromHash = decodeURIComponent(location.hash.slice(1));
    S.cur = S.byId[fromHash] ? fromHash : (S.cards.find(c => !answered(S.answers[c.id])) || S.cards[0] || {}).id || null;
    S.loaded = true;
  }
  renderQueue();
  const c = card();
  if ((c ? JSON.stringify(c) : '') !== S.shownSig && !noteFocused()) renderCard(0);
  paint();
}
const noteFocused = () => !!S.refs && document.activeElement === S.refs.note;
const idx = id => S.cards.findIndex(c => c.id === id);
const neighbour = d => S.cards[idx(S.cur) + d]?.id;

function go(id) {
  if (!id || !S.byId[id] || id === S.cur) return;
  if (S.timers[S.cur]) send(S.cur);
  S.cur = id;
  history.replaceState(null, '', '#' + encodeURIComponent(id));
  $('#drawer').classList.remove('open');
  renderCard(1);
  paint();
}

/* queue */
function renderQueue() {
  const sig = S.cards.map(c => [c.id, c.tag, c.title].join('\u0001')).join('\u0002');
  if (sig === S.qSig) return;
  S.qSig = sig;
  $('#qlist').replaceChildren(...S.cards.map(c => h('button', { class: 'qi', type: 'button', 'data-id': c.id, onclick: () => go(c.id) },
    h('span', { class: 't', text: str(c.title) || c.id }), h('span', { class: 'g', text: str(c.tag) || c.id }), h('span', { class: 'c' }))));
  $('#ticks').replaceChildren(...S.cards.map(c => h('button', { type: 'button', 'data-id': c.id, title: str(c.title), 'aria-label': str(c.title), onclick: () => go(c.id) })));
}

/* stage */
function frameFor(t, c) {
  const m = t.m;
  const fr = h('div', { class: 'frame' });
  const src = m.img || null;
  if (src && S.ar[src]) fr.style.setProperty('--ar', S.ar[src]);
  const setAr = (w, hgt) => { if (w && hgt) { const r = (w / hgt).toFixed(4); if (src) S.ar[src] = r; fr.style.setProperty('--ar', r); if (take() === t) $('#stage').style.setProperty('--sar', r); } };
  if (src) {
    const img = h('img', { src, alt: str(m.caption || t.name), decoding: 'async', draggable: 'false' });
    img.addEventListener('load', () => setAr(img.naturalWidth, img.naturalHeight));
    fr.append(img);
  } else if (m.video) {
    const v = h('video', { src: m.video + '#t=0.1', preload: 'metadata', muted: true, playsinline: true });
    v.muted = true;
    v.addEventListener('loadedmetadata', () => setAr(v.videoWidth, v.videoHeight));
    fr.append(v);
  }
  fr.append(ink());
  fr.addEventListener('click', () => { if (!fr.classList.contains('wipe') && m.video) toggleVideo(); });
  return fr;
}
function ink() {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'ink');
  const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  for (const [k, v] of Object.entries({ x: '0', y: '0', width: '100%', height: '100%', rx: '12', pathLength: '100' })) r.setAttribute(k, v);
  s.append(r);
  return s;
}
function slateFor(t, c) {
  const m = t.m;
  const body = t.kind === 'now' ? m.caption || c.today : t.kind === 'result' ? m.caption : m.rule;
  return h('div', { class: 'slate' + (t.rec ? ' rec' : '') },
    h('div', { class: 'sk' }, h('b', { class: t.kind === 'now' ? 'cap now' : '', text: t.kind === 'opt' ? t.key : t.kind === 'now' ? '·' : '=' }), t.kind === 'opt' ? (t.rec ? 'Recommended take' : 'Take') : t.name),
    h('h2', {}, rich(t.kind === 'opt' ? t.name : t.kind === 'now' ? c.today || 'Now' : t.name)),
    t.kind !== 'now' || m.caption ? h('p', {}, rich(body)) : null,
    h('span', { class: 'nr', text: 'Not recorded' }));
}
function wipeFor(t, c) {
  const fr = frameFor({ kind: 'now', m: c.now, name: 'Now' }, c);
  fr.classList.add('wipe');
  const top = h('img', { class: 'top', src: t.m.img, alt: str(t.name), decoding: 'async', draggable: 'false' });
  fr.querySelector('.ink').before(top, h('div', { class: 'divider' }, h('span', { class: 'grip' }, icon('arrows-horizontal'))));
  fr.style.setProperty('--x', S.x + '%');
  fr.addEventListener('pointerdown', e => {
    if (e.button) return;
    fr.setPointerCapture(e.pointerId);
    fr.classList.add('drag');
    const move = ev => { const b = fr.getBoundingClientRect(); setX((ev.clientX - b.left) / b.width * 100); };
    move(e);
    fr.onpointermove = move;
    fr.onpointerup = fr.onpointercancel = () => { fr.onpointermove = null; fr.classList.remove('drag'); };
  });
  return fr;
}
function setX(x) {
  S.x = Math.max(0, Math.min(100, x));
  const fr = $('#stage .layer:not(.leave) .frame.wipe');
  if (fr) fr.style.setProperty('--x', S.x + '%');
}

function showStage(mode) {
  stopVideo();
  const stage = $('#stage'), c = card(), t = take();
  const old = [...stage.querySelectorAll('.layer:not(.leave), .skel')];
  const anim = !reduced.matches && mode !== 'instant';
  for (const o of old) {
    if (!anim || o.classList.contains('skel')) { o.remove(); continue; }
    o.classList.add('leave'); if (mode === 'reel') o.classList.add('reel');
    setTimeout(() => o.remove(), 320);
  }
  let content;
  if (!c) content = h('div', { class: 'slate' }, h('h2', { text: 'Nothing to decide' }), h('p', { text: 'When an agent puts a question on the desk, it opens here.' }));
  else if (!t) content = h('div', { class: 'slate' }, h('h2', {}, rich(c.title)), h('p', {}, rich(c.today)), h('span', { class: 'nr', text: 'No takes on this card' }));
  else if (S.wipe && canWipe(t)) content = wipeFor(t, c);
  else if (hasMedia(t.m)) content = frameFor(t, c);
  else content = slateFor(t, c);
  const layer = h('div', { class: 'layer' + (anim ? ' enter' + (mode === 'reel' ? ' reel' : '') : '') }, content);
  const glow = t && (S.wipe && canWipe(t) ? t.m.img : t.m.img);
  if (glow) layer.style.setProperty('--glow', `url("${glow.replace(/"/g, '')}")`);
  layer.addEventListener('animationend', e => { if (e.target === layer) layer.classList.remove('enter', 'reel'); });
  stage.insertBefore(layer, $('#sub'));
  const src = t?.m?.img;
  if (src && S.ar[src]) stage.style.setProperty('--sar', S.ar[src]);
  if (content.classList.contains('frame') && !content.classList.contains('wipe')) content.classList.toggle('picked', isPicked(t));
  renderSub();
}
const curFrame = () => $('#stage .layer:not(.leave) .frame');

function renderSub() {
  const t = take(), c = card(), sub = $('#sub');
  if (!t) { sub.replaceChildren(); return; }
  const wiping = S.wipe && canWipe(t);
  const kids = [];
  if (wiping) kids.push(h('span', { class: 'cap now', text: 'Now' }), h('span', { class: 'vs', text: 'against' }));
  kids.push(h('span', { class: 'cap' + (t.kind === 'now' ? ' now' : t.rec ? ' rec' : ''), text: t.key }),
    h('span', { class: 'nm' }, rich(t.kind === 'opt' ? t.name : t.kind === 'now' ? (t.m.caption || 'The screen today') : t.name)));
  if (isPicked(t)) kids.push(h('span', { class: 'flag picked' }, icon('check-circle', true), 'Picked'));
  else if (t.rec) kids.push(h('span', { class: 'flag rec' }, icon('star', true), 'Recommended'));
  kids.push(h('span', { class: 'grow' }));
  if (wiping) kids.push(h('span', { class: 'vs', text: 'drag, or Shift ← →' }));
  else if (t.m.video) {
    const p = h('span', { class: 'prog', title: 'Seek', onclick: e => seek(e, p) }, h('span', {}, h('i')));
    S.refs.prog = p;
    S.refs.tc = h('span', { class: 'tc', text: fmt(0) + ' / ' + fmt(t.m.dur) });
    kids.push(p, S.refs.tc);
  }
  sub.replaceChildren(...kids);
  paintTools();
}

/* video */
function toggleVideo() {
  const t = take();
  if (!t?.m?.video) return;
  if (S.video) { S.video.paused ? S.video.play().catch(() => {}) : S.video.pause(); paintTools(); return; }
  if (S.wipe) { S.wipe = false; showStage('instant'); }
  startVideo(t.m.video, 0);
}
function startVideo(src, attempt) {
  const fr = curFrame();
  if (!fr) return;
  fr.querySelector('video')?.remove();
  fr.querySelector('.vfail')?.remove();
  const v = h('video', { src: attempt ? src + '?r=' + Date.now() : src, playsinline: true, autoplay: true, muted: true, preload: 'auto' });
  v.muted = true;
  S.video = v;
  v.addEventListener('error', () => {
    if (S.video !== v) return;
    if (attempt < 2) return setTimeout(() => { if (S.video === v) startVideo(src, attempt + 1); }, 800);
    v.remove(); S.video = null;
    fr.append(h('div', { class: 'vfail' }, icon('video-camera-slash'), 'The screencast did not open',
      h('a', { href: src, target: '_blank', rel: 'noopener', text: 'Open the file' })));
    paintTools();
  }, { once: true });
  v.addEventListener('timeupdate', () => paintProgress(v));
  v.addEventListener('play', paintTools);
  v.addEventListener('pause', paintTools);
  v.addEventListener('ended', () => { setTimeout(() => { if (S.video === v) stopVideo(); }, 700); });
  fr.querySelector('.ink').before(v);
  v.play().catch(() => {});
  paintTools();
}
function stopVideo() {
  if (S.video) { S.video.pause(); S.video.removeAttribute('src'); S.video.load(); S.video.remove(); S.video = null; }
  if (S.refs?.prog) S.refs.prog.style.setProperty('--p', 0);
  paintTools();
}
function paintProgress(v) {
  const r = S.refs;
  if (!r?.prog || !v.duration) return;
  r.prog.querySelector('i').style.setProperty('--p', v.currentTime / v.duration);
  r.tc.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
}
function seek(e, p) {
  const t = take();
  if (!t?.m?.video) return;
  const b = p.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width));
  if (!S.video) startVideo(t.m.video, 0);
  const v = S.video;
  const to = () => { v.currentTime = f * v.duration; };
  v.readyState >= 1 ? to() : v.addEventListener('loadedmetadata', to, { once: true });
}

/* takes */
function setTake(i, dir) {
  const ts = takes();
  if (!ts.length) return;
  i = Math.max(0, Math.min(ts.length - 1, i));
  if (i === tIdx() && dir !== 'force') return;
  S.view[S.cur] = i;
  showStage();
  renderTake(true);
  paintStrip();
}
function step(d) {
  const ts = takes();
  let i = tIdx() + d;
  if (S.wipe) while (ts[i] && !canWipe(ts[i])) i += d;
  if (ts[i]) setTake(i);
}
function toggleWipe() {
  const ts = takes();
  if (!ts.some(canWipe)) return;
  S.wipe = !S.wipe;
  if (S.wipe && !canWipe(take())) {
    const t = ts.find(t => canWipe(t) && t.rec) || ts.find(canWipe);
    S.view[S.cur] = ts.indexOf(t);
    renderTake(true);
  }
  showStage(S.wipe ? 'instant' : undefined);
  if (S.wipe) {
    const fr = curFrame();
    if (fr && !reduced.matches) { fr.classList.add('sweep'); fr.offsetWidth; requestAnimationFrame(() => fr.classList.remove('sweep')); }
  }
  paintStrip();
}

/* card */
function renderCard(mode) {
  const c = card();
  S.shownSig = c ? JSON.stringify(c) : '';
  stopVideo();
  const ts = c ? takesOf(c) : [];
  if (S.view[S.cur] == null || S.view[S.cur] >= ts.length) S.view[S.cur] = 0;
  const tb = $('#titlebox');
  $('#tag').replaceChildren(c?.link ? h('a', { href: c.link, target: '_blank', rel: 'noopener', text: str(c.tag) || 'issue' }) : str(c?.tag));
  $('#title').replaceChildren(...(c ? rich(c.title || c.id) : ['Nothing to decide']));
  $('#title').title = c ? str(c.title) : '';
  if (mode && !reduced.matches) { tb.classList.remove('swap'); tb.offsetWidth; tb.classList.add('swap'); }
  document.title = c ? str(c.tag) + ' ' + str(c.title) : 'Decision desk';

  const refs = { takes: ts };
  S.refs = refs;
  if (!ts.some(canWipe)) S.wipe = false;
  else if (S.wipe && !canWipe(ts[S.view[S.cur]])) S.view[S.cur] = ts.findIndex(canWipe);

  /* strip */
  const track = $('#track');
  refs.thumbs = ts.map((t, i) => {
    const shot = h('span', { class: 'shot' }, t.m.img ? h('img', { src: t.m.img, alt: '', loading: 'lazy', decoding: 'async', onload: e => { S.ar[t.m.img] ??= (e.target.naturalWidth / e.target.naturalHeight).toFixed(4); } })
      : t.m.video ? h('video', { src: t.m.video + '#t=0.1', preload: 'metadata', muted: true, playsinline: true, style: 'width:100%;height:100%;object-fit:contain' })
      : h('span', { class: 'sl', text: t.kind === 'opt' ? t.key : '·' }));
    return h('button', { class: 'thumb ' + t.kind + (t.rec ? ' rec' : ''), type: 'button', role: 'tab', 'data-i': i, onclick: () => { if (S.wipe && !canWipe(t)) S.wipe = false; setTake(i, 'force'); } },
      shot, h('span', { class: 'lab' }, h('span', { class: 'k', text: t.key }), h('span', { class: 'n', text: t.kind === 'opt' ? t.name.replace(/`/g, '') : t.kind === 'now' ? 'The screen today' : t.name }),
        t.rec ? h('span', { class: 'st' }, icon('star', true)) : null, h('span', { class: 'ok' }, icon('check-circle', true))));
  });
  track.replaceChildren(...refs.thumbs, $('#playhead'));

  /* panel */
  refs.take = h('div', { class: 'take' });
  const facts = [['Why', c?.why], ['Elsewhere', c?.elsewhere], ['Unchanged', c?.unchanged]].filter(f => str(f[1]).trim());
  $('#scroll').replaceChildren(...(c ? [
    h('div', {},
      h('div', { class: 'meta' }, c.link ? h('a', { href: c.link, target: '_blank', rel: 'noopener', text: str(c.tag) || 'issue' }) : h('span', { text: str(c.tag) }),
        c.visible ? h('span', {}, 'Visible: ', rich(c.visible)) : h('span', { text: 'Nothing visible changes' })),
      c.today ? h('p', { class: 'today' }, rich(c.today)) : null),
    refs.take,
    facts.length ? h('div', { class: 'facts' }, facts.map(([k, v]) => h('div', {}, h('p', { class: 'lbl', text: k }), h('p', {}, rich(v))))) : null,
  ] : [h('p', { class: 'today', text: 'The queue is empty.' })]));
  $('#scroll').scrollTop = 0;

  const recKeys = c ? arr(c.options).filter(o => o?.rec).map(o => str(o.key)) : [];
  refs.rec = recKeys.length ? h('button', { class: 'btn go', type: 'button', onclick: () => pickMany(recKeys) }) : null;
  refs.later = c ? h('button', { class: 'btn', type: 'button', onclick: () => later(c) }, icon('clock'), 'Park', h('kbd', { text: 'L' })) : null;
  refs.next = h('button', { class: 'btn next', type: 'button', onclick: () => go(neighbour(1)) }, 'Next', icon('arrow-right'));
  refs.saved = h('span', { class: 'saved', 'aria-live': 'polite' });
  refs.note = c ? h('textarea', { id: 'note', rows: 1, placeholder: 'Your own take, a question or a fix. Dictation works.',
    oninput: e => { grow(e.target); save(c.id, { note: e.target.value }, 600); },
    onblur: () => { if (S.timers[c.id]) send(c.id); if (card() && JSON.stringify(card()) !== S.shownSig) { renderCard(0); paint(); } } }) : null;
  if (refs.note) refs.note.value = str((S.answers[c.id] || {}).note);
  $('#dock').replaceChildren(...(c ? [
    h('div', { class: 'drow' }, refs.rec, refs.later, refs.next),
    h('div', { class: 'notewrap' }, h('label', { for: 'note' }, h('span', { text: 'Note' }), refs.saved), refs.note)] : []));
  if (refs.note) requestAnimationFrame(() => grow(refs.note));

  renderTake(false);
  showStage(mode ? 'reel' : (S.loadedStage ? 'instant' : undefined));
  S.loadedStage = true;
  paintStrip();
}

function renderTake(anim) {
  const t = take(), box = S.refs?.take;
  if (!box) return;
  if (!t) { box.replaceChildren(); return; }
  const m = t.m;
  const kids = [h('h2', {}, h('span', { class: 'cap' + (t.kind === 'now' ? ' now' : t.rec ? ' rec' : ''), text: t.key }),
    h('span', {}, rich(t.kind === 'now' ? 'The screen today' : t.name)))];
  if (t.rec) kids.push(h('span', { class: 'badge' }, icon('star', true), 'Recommended'));
  const text = t.kind === 'opt' ? m.rule : m.caption;
  if (str(text).trim() && hasMedia(m)) kids.push(h('p', { class: 'rule' }, rich(text)));
  const ks = arr(m.keys).map(str).filter(Boolean);
  if (ks.length) kids.push(h('div', {}, h('p', { class: 'lbl', text: 'Keys' }), h('div', { class: 'keys' }, ks.map(k => h('kbd', { text: k })))));
  if (t.kind === 'opt' && (m.adds || m.cons)) kids.push(h('div', { class: 'pair' },
    m.adds ? h('div', {}, h('p', { class: 'lbl adds', text: 'Adds to the screen' }), h('p', {}, rich(m.adds))) : h('div'),
    m.cons ? h('div', {}, h('p', { class: 'lbl', text: 'Cost' }), h('p', {}, rich(m.cons))) : h('div')));
  box.replaceChildren(...kids);
  if (anim && !reduced.matches) { box.classList.remove('swap'); box.offsetWidth; box.classList.add('swap'); }
}

function paintStrip() {
  const r = S.refs;
  if (!r?.thumbs) return;
  const i = tIdx(), p = arr((S.answers[S.cur] || {}).pick), multi = !!card()?.multi;
  r.thumbs.forEach((b, k) => {
    const t = r.takes[k];
    b.classList.toggle('on', k === i);
    b.setAttribute('aria-selected', String(k === i));
    b.classList.toggle('picked', t.kind === 'opt' && p.includes(t.key));
    b.classList.toggle('mute', !multi && p.length > 0 && t.kind === 'opt' && !p.includes(t.key) && k !== i);
  });
  const cur = r.thumbs[i], ph = $('#playhead');
  if (cur) {
    ph.style.width = cur.offsetWidth + 'px';
    ph.style.transform = `translateX(${cur.offsetLeft}px)`;
    const tr = $('#track');
    if (cur.offsetLeft < tr.scrollLeft || cur.offsetLeft + cur.offsetWidth > tr.scrollLeft + tr.clientWidth) tr.scrollTo({ left: cur.offsetLeft - 16, behavior: reduced.matches ? 'auto' : 'smooth' });
  }
  paintTools();
}
function paintTools() {
  const t = take(), w = $('#wipeBtn'), pl = $('#playBtn');
  w.disabled = !takes().some(canWipe);
  w.setAttribute('aria-pressed', String(S.wipe && canWipe(t)));
  pl.disabled = !t?.m?.video;
  const playing = S.video && !S.video.paused;
  pl.querySelector('i').className = 'ph ph-' + (playing ? 'pause' : 'play');
  pl.querySelector('span').textContent = playing ? 'Pause' : t?.m?.dur ? 'Play ' + fmt(t.m.dur) : 'Play';
}

/* answers */
function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }
function save(id, patch, debounce = 0) {
  S.answers[id] = { ...(S.answers[id] || {}), ...patch };
  S.pending[id] = true;
  S.saveState[id] = 'saving';
  clearTimeout(S.timers[id]);
  if (debounce) S.timers[id] = setTimeout(() => send(id), debounce);
  else send(id);
  paint();
}
async function send(id, keepalive = false) {
  clearTimeout(S.timers[id]);
  delete S.timers[id];
  const a = S.answers[id] || {};
  const seq = S.seq[id] = (S.seq[id] || 0) + 1;
  const body = { pick: arr(a.pick), note: str(a.note) };
  if (a.status) body.status = a.status;
  try {
    const r = await fetch('api/answers/' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive });
    if (!r.ok) throw new Error(r.status);
    const doc = await r.json();
    if (S.seq[id] === seq && !S.timers[id]) { S.answers[id] = { ...S.answers[id], at: doc.at }; delete S.pending[id]; S.saveState[id] = 'saved'; }
  } catch { if (S.seq[id] === seq) S.saveState[id] = 'error'; }
  paint();
}
const isPicked = t => !!t && t.kind === 'opt' && arr((S.answers[S.cur] || {}).pick).includes(t.key);

function pick(key) {
  const c = card();
  if (!c || !arr(c.options).some(o => str(o?.key) === key)) return;
  const a = S.answers[c.id] || {};
  let p = arr(a.pick);
  const adding = !p.includes(key);
  if (c.multi) p = adding ? [...p, key].sort() : p.filter(k => k !== key);
  else p = adding ? [key] : [];
  save(c.id, { pick: p, status: 'answered' });
  const i = takes().findIndex(t => t.kind === 'opt' && t.key === key);
  if (i >= 0 && i !== tIdx()) { if (S.wipe && !canWipe(takes()[i])) S.wipe = false; setTake(i); }
  else renderSub();
  if (adding) ship();
}
function pickMany(keys) {
  const c = card();
  if (!c) return;
  const cur = arr((S.answers[c.id] || {}).pick);
  if (cur.join() === keys.join()) return;
  save(c.id, { pick: keys, status: 'answered' });
  const i = takes().findIndex(t => t.kind === 'opt' && t.key === keys[0]);
  if (i >= 0 && i !== tIdx()) setTake(i); else renderSub();
  ship();
}
function ship() {
  const fr = curFrame();
  paint();
  if (!fr || reduced.matches) return;
  const s = fr.querySelector('.ink');
  s.classList.remove('draw'); s.getBoundingClientRect(); s.classList.add('draw');
  fr.animate([{ transform: 'scale(.985)' }, { transform: 'scale(1)' }], { duration: 520, easing: 'cubic-bezier(.16,1,.3,1)' });
}
function later(c) { save(c.id, { status: (S.answers[c.id] || {}).status === 'later' ? 'answered' : 'later' }); }
function status(a) {
  if (a.status === 'later') return ['later', 'parked'];
  if (arr(a.pick).length) return ['pick', a.pick.join('+')];
  if (str(a.note).trim()) return ['text', 'note'];
  return ['', 'open'];
}

function paint() {
  let waiting = 0;
  for (const c of S.cards) {
    const a = S.answers[c.id] || {};
    if (!answered(a)) waiting++;
    const [kind, text] = status(a);
    const item = $(`.qi[data-id="${CSS.escape(c.id)}"]`);
    if (item) {
      item.classList.toggle('cur', c.id === S.cur);
      const st = $('.c', item);
      st.className = 'c ' + kind; st.textContent = text;
    }
    const tick = $(`#ticks [data-id="${CSS.escape(c.id)}"]`);
    if (tick) tick.className = (kind === 'later' ? 'later' : kind === 'text' ? 'text' : kind ? 'done' : '') + (c.id === S.cur ? ' cur' : '');
  }
  const total = S.cards.length, pos = idx(S.cur) + 1;
  $('#pos').textContent = total ? `${pos} / ${total}` : '0';
  const wc = $('#waitc');
  wc.className = 'waitc' + (total && !waiting ? ' done' : '');
  wc.textContent = !total ? '' : waiting ? `${waiting} open` : 'All answered';
  $('#dcount').textContent = total ? (waiting ? `${waiting} of ${total} open` : 'All answered. Tell Claude it is done.') : 'Empty';
  $('#prev').disabled = !neighbour(-1);
  $('#next').disabled = !neighbour(1);
  const broken = $('#broken');
  broken.hidden = !S.broken.length;
  broken.textContent = S.broken.map(b => `Card ${b.id} did not open: ${b.problem}`).join('\n');
  const cq = $(`.qi[data-id="${CSS.escape(S.cur || '')}"]`);
  if (cq && $('#drawer').classList.contains('open')) cq.scrollIntoView({ block: 'nearest' });

  const c = card(), r = S.refs;
  if (!c || !r?.saved) return;
  const a = S.answers[c.id] || {}, p = arr(a.pick);
  const fr = curFrame();
  if (fr && !fr.classList.contains('wipe')) fr.classList.toggle('picked', isPicked(take()));
  paintStrip();
  const subFlag = $('#sub .flag');
  const t = take();
  if (t && ((isPicked(t) && !subFlag?.classList.contains('picked')) || (!isPicked(t) && subFlag?.classList.contains('picked')))) renderSub();
  if (r.rec) {
    const recKeys = arr(c.options).filter(o => o?.rec).map(o => str(o.key));
    const on = recKeys.join() === p.join();
    r.rec.classList.toggle('on', on);
    r.rec.replaceChildren(...[icon(on ? 'check-circle' : 'star', true), on ? 'Picked ' + recKeys.join(' + ') : 'Recommended ' + recKeys.join(' + '), on ? null : h('kbd', { text: 'R' })].filter(Boolean));
  }
  r.later.setAttribute('aria-pressed', String(a.status === 'later'));
  r.later.replaceChildren(icon('clock', a.status === 'later'), a.status === 'later' ? 'Parked' : 'Park', h('kbd', { text: 'L' }));
  r.next.hidden = !(answered(a) && neighbour(1));
  const st = S.saveState[c.id];
  const sv = st === 'saving' ? [icon('circle-notch'), 'Saving']
    : st === 'error' ? [icon('warning'), 'Not saved, retrying']
    : a.at ? [icon('check-circle', true), 'Saved ' + time(a.at)] : [];
  if (r.saved.dataset.st !== (st || '') + (a.at || '')) {
    r.saved.dataset.st = (st || '') + (a.at || '');
    r.saved.className = 'saved' + (st === 'error' ? ' err' : st === 'saved' ? ' ok' : '');
    r.saved.replaceChildren(...sv);
  }
  if (!noteFocused() && !S.timers[c.id] && r.note.value !== str(a.note)) { r.note.value = str(a.note); grow(r.note); }
}

/* input */
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/TEXTAREA|INPUT/.test(document.activeElement?.tagName || '')) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (e.code === 'Escape' && $('#drawer').classList.contains('open')) { $('#drawer').classList.remove('open'); return; }
  const c = card();
  if (!c) return;
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    e.preventDefault();
    const d = e.code === 'ArrowLeft' ? -1 : 1;
    if (e.shiftKey && S.wipe) { const fr = curFrame(); fr?.classList.add('drag'); setX(S.x + d * 5); requestAnimationFrame(() => fr?.classList.remove('drag')); }
    else step(d);
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); toggleVideo(); return; }
  const letter = /^Key([A-Z])$/.exec(e.code)?.[1];
  if (!letter) return;
  if ('ABCD'.includes(letter)) { e.preventDefault(); pick(letter); }
  else if (letter === 'R' && S.refs?.rec) { e.preventDefault(); S.refs.rec.click(); }
  else if (letter === 'L') { e.preventDefault(); later(c); }
  else if (letter === 'N') { e.preventDefault(); S.refs?.note?.focus(); }
  else if (letter === 'W') { e.preventDefault(); toggleWipe(); }
  else if (letter === 'J') { e.preventDefault(); go(neighbour(1)); }
  else if (letter === 'K') { e.preventDefault(); go(neighbour(-1)); }
  else if (letter === 'Q') { e.preventDefault(); $('#drawer').classList.toggle('open'); paint(); }
});
addEventListener('resize', () => paintStrip());
addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if (S.byId[id]) go(id); });
addEventListener('pagehide', () => { for (const id of Object.keys(S.timers)) send(id, true); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
$('#prev').onclick = () => go(neighbour(-1));
$('#next').onclick = () => go(neighbour(1));
$('#qbtn').onclick = () => { $('#drawer').classList.add('open'); paint(); };
$('#scrim').onclick = () => $('#drawer').classList.remove('open');
$('#wipeBtn').onclick = toggleWipe;
$('#playBtn').onclick = toggleVideo;

poll();
setInterval(() => { if (!document.hidden) poll(); }, 2000);
</script>
</body>
</html>
