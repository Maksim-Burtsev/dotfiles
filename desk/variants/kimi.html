<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>merl · decision desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16161e; --bg2:#1a1b26; --panel:#1f2335; --panel2:#24283b;
  --line:#292e42; --line2:#3b4261;
  --fg:#c0caf5; --dim:#565f89; --dim2:#7982a9;
  --blue:#7aa2f7; --cyan:#7dcfff; --green:#9ece6a; --red:#f7768e;
  --yellow:#e0af68; --magenta:#bb9af7;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg2);color:var(--fg);font-family:var(--mono);
  font-size:15px;line-height:1.55;padding-bottom:118px;
  background-image:radial-gradient(1200px 600px at 82% -10%,rgba(122,162,247,.07),transparent 60%);
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* top statusline */
#topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  height:46px;padding:0 20px;border-bottom:1px solid var(--line);
  background:rgba(22,22,30,.9);backdrop-filter:blur(8px);font-size:13.5px;
}
#brand{font-weight:700;letter-spacing:.4px;white-space:nowrap}
#brand .slash{color:var(--dim)}
.caret{display:inline-block;width:9px;height:16px;background:var(--blue);vertical-align:-3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#counts{display:flex;gap:14px;color:var(--dim);margin-left:auto;white-space:nowrap}
#counts b{font-weight:500}
#counts .c-open b{color:var(--fg)}
#counts .c-dec b{color:var(--cyan)}
#counts .c-park b{color:var(--yellow)}
#counts .c-bad b{color:var(--yellow)}

#shell{display:flex;align-items:flex-start}

/* queue */
#queue{
  width:300px;flex:0 0 300px;position:sticky;top:46px;
  max-height:calc(100vh - 46px - 118px);overflow:auto;
  border-right:1px solid var(--line);padding:12px 10px 24px;
}
.q-head{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);padding:4px 10px 10px}
.q-sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);padding:14px 10px 6px}
.q-sec .q-count{color:var(--dim)}
.q-sec.warn{color:var(--yellow)}
.q-item{
  display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-radius:6px;
  cursor:pointer;border-left:2px solid transparent;min-width:0;
}
.q-item:hover{background:var(--panel)}
.q-item.active{border-left-color:var(--blue);background:var(--panel)}
.q-tag{color:var(--blue);font-size:12.5px;flex:0 0 auto}
.q-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim2);font-size:13px;min-width:0}
.q-item.active .q-title{color:var(--fg)}
.q-mk{margin-left:auto;font-size:11.5px;flex:0 0 auto;padding-left:8px}
.mk-dec{color:var(--cyan)}
.mk-park{color:var(--yellow)}
.q-bad{padding:4px 10px;font-size:12px;color:var(--dim)}
.q-bad .q-tag{color:var(--yellow)}
.q-bad .prob{color:var(--dim)}
.q-empty{padding:18px 10px;color:var(--dim);font-size:13px}

/* stage */
#stage{flex:1;min-width:0;padding:30px 44px 48px;max-width:2400px}
.empty{color:var(--dim);padding:60px 0;text-align:center}
.card-head{margin-bottom:26px}
.head-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{
  font-size:12.5px;background:var(--panel);border:1px solid var(--line2);
  border-radius:5px;padding:2px 9px;color:var(--blue);
}
.multi{font-size:11.5px;color:var(--magenta);border:1px solid var(--line2);border-radius:5px;padding:2px 9px}
h1{font-size:24px;font-weight:700;line-height:1.3;margin:12px 0 6px;max-width:60ch}
.visible{font-size:13px;color:var(--dim2);margin-top:4px}
.visible span{
  color:var(--dim);text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;
  margin-right:10px;
}
.decision{display:flex;gap:10px;align-items:baseline;margin-top:12px;flex-wrap:wrap;font-size:12.5px}
.dec{border-radius:5px;padding:2px 9px;border:1px solid var(--line2)}
.dec-done{color:var(--cyan);border-color:var(--cyan)}
.dec-park{color:var(--yellow);border-color:var(--yellow)}
.dec-note{color:var(--dim2)}
.dec-at{color:var(--dim)}

.sec-label{
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;
}
section{border-top:1px solid var(--line);padding:22px 0 6px;margin-top:22px}
.card-head{border-top:0;padding-top:0;margin-top:0}

/* now: the only red on the page */
.now{border-left:3px solid var(--red);padding-left:20px;margin-left:-23px}
.now .sec-label{color:var(--red)}
.today{font-size:16.5px;max-width:78ch;margin:0 0 12px}
.caption{color:var(--dim);font-size:13px;margin:10px 0 8px;max-width:90ch}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
kbd{
  font:inherit;font-size:12.5px;background:var(--panel2);border:1px solid var(--line2);
  border-bottom-width:2px;border-radius:5px;padding:1px 8px;color:var(--fg);white-space:nowrap;
}

/* media */
.media{
  position:relative;border:1px solid var(--line2);border-radius:8px;overflow:hidden;
  background:#10111a;margin-top:12px;max-width:1100px;
}
.media img,.media video{display:block;width:100%;height:auto}
.focusbox{
  position:absolute;border:1.5px solid var(--yellow);border-radius:4px;pointer-events:none;
  box-shadow:0 0 0 1px rgba(13,14,20,.55),inset 0 0 0 1px rgba(13,14,20,.55);
}
.dur{
  position:absolute;right:8px;bottom:8px;font-size:11.5px;color:var(--dim2);
  background:rgba(13,14,20,.82);border-radius:4px;padding:1px 7px;
}
.nosignal{
  aspect-ratio:16/9;display:grid;place-items:center;color:var(--dim);
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;
}

/* options */
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:18px;border-top:0;padding-top:0}
.opt{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px 14px;cursor:pointer;transition:border-color .18s,background .18s;
}
.opt:hover{border-color:var(--line2)}
.opt.picked{border-color:var(--blue);background:var(--panel2)}
.opt-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.opt-key{
  width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;
  border:1px solid var(--line2);border-radius:8px;font-size:17px;font-weight:700;color:var(--blue);
}
.opt.picked .opt-key{background:var(--blue);color:var(--bg);border-color:var(--blue)}
.opt h3{font-size:15.5px;margin:0;font-weight:700;line-height:1.35;min-width:0}
.rec{margin-left:auto;font-size:11px;color:var(--green);display:flex;align-items:center;gap:6px;white-space:nowrap}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.rule{font-size:13.5px;color:var(--dim2);margin:0 0 4px}
.opt .media{margin-top:12px}
.delta{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.delta>div{display:flex;gap:8px;margin:3px 0}
.delta b{font-weight:700;flex:0 0 12px}
.adds b{color:var(--cyan)}
.cons{color:var(--dim2)}
.cons b{color:var(--yellow)}

/* shared end screen */
.result .media{max-width:900px}

/* triptych */
.triptych{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.tri p{font-size:13px;color:var(--dim2);margin:0;max-width:70ch}
.tri:first-child .sec-label{color:var(--blue)}

/* footer: command line + statusline */
#deck-footer{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--bg);border-top:1px solid var(--line);transition:border-color .4s;
}
#deck-footer.pulse{border-top-color:var(--cyan)}
#notebar{display:flex;align-items:flex-start;gap:10px;padding:9px 16px 4px}
.prompt{color:var(--magenta);font-size:13px;padding-top:7px;flex:0 0 auto}
#note{
  flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  color:var(--fg);font:inherit;font-size:13.5px;padding:6px 10px;resize:none;height:60px;
}
#note:focus{outline:none;border-color:var(--magenta)}
#note::placeholder{color:var(--dim)}
#note:disabled{opacity:.45}
#notestate{font-size:11.5px;color:var(--dim);padding-top:9px;flex:0 0 auto;min-width:86px;text-align:right}
#statusline{
  display:flex;gap:18px;padding:4px 16px 8px;font-size:12px;color:var(--dim);
  align-items:baseline;flex-wrap:wrap;
}
#st-mode{color:var(--blue);font-weight:700}
#st-pos{color:var(--dim2)}
#st-sync{margin-left:auto}
#st-keys{white-space:nowrap}

@media (max-width:900px){
  body{font-size:13.5px;padding-bottom:118px}
  #shell{flex-direction:column}
  #queue{
    width:100%;flex:none;position:static;max-height:190px;
    border-right:0;border-bottom:1px solid var(--line);
  }
  #stage{padding:18px 14px 34px}
  #topbar{padding:0 12px;gap:10px}
  #counts{gap:9px;font-size:12px}
  .options{grid-template-columns:1fr}
  .now{padding-left:14px;margin-left:-17px}
  h1{font-size:19px}
  .today{font-size:14.5px}
  #st-keys{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<header id="topbar">
  <span id="brand">merl <span class="slash">/</span> decision desk <span class="caret"></span></span>
  <span id="counts">
    <span class="c-open"><b id="c-open">0</b> open</span>
    <span class="c-park"><b id="c-park">0</b> parked</span>
    <span class="c-dec"><b id="c-dec">0</b> decided</span>
    <span class="c-bad" id="c-bad-wrap" hidden><b id="c-bad">0</b> unreadable</span>
  </span>
</header>
<div id="shell">
  <aside id="queue" aria-label="queue"></aside>
  <main id="stage"><div class="empty">loading desk...</div></main>
</div>
<footer id="deck-footer">
  <div id="notebar">
    <span class="prompt">note&gt;</span>
    <textarea id="note" rows="2" placeholder="dictate or type; autosaves while you think" spellcheck="false" disabled></textarea>
    <span id="notestate"></span>
  </div>
  <div id="statusline">
    <span id="st-mode">desk</span>
    <span id="st-pos"></span>
    <span id="st-sync"></span>
    <span id="st-keys">j/k move &middot; a-d pick &middot; r recommended &middot; l park &middot; n note &middot; esc back</span>
  </div>
</footer>
<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = v => typeof v === "string" ? v : "";
const A = v => Array.isArray(v) ? v : [];
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = {
  etag: null,
  cards: [],
  answers: {},
  broken: [],
  activeId: null,
  drafts: new Map(),
  fp: "",
  lastSync: null,
};

const answerFor = id => {
  const a = state.answers[id];
  return a && typeof a === "object" ? a : null;
};
const cardById = id => state.cards.find(c => c.id === id) || null;
const keyOf = o => S(o && o.key).toUpperCase();
const pickSetOf = id => new Set(A(answerFor(id) && answerFor(id).pick).map(x => S(x).toUpperCase()).filter(Boolean));

function groupsOf(){
  const g = {open: [], parked: [], decided: []};
  for (const c of state.cards){
    const a = answerFor(c.id);
    if (a && S(a.status) === "answered") g.decided.push(c);
    else if (a && (S(a.status) === "later" || S(a.note).trim())) g.parked.push(c);
    else g.open.push(c);
  }
  return g;
}
const displayOrder = () => {
  const g = groupsOf();
  return [...g.open, ...g.parked, ...g.decided].map(c => c.id);
};

function fmtDur(d){
  if (typeof d !== "number" || !isFinite(d) || d < 0) return "";
  const s = Math.round(d);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function fmtAt(at){
  const t = Date.parse(S(at));
  if (!isFinite(t)) return "";
  const d = new Date(t);
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth() + 1)} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtClock(t){
  const d = new Date(t), p = n => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function focusBox(f){
  if (!Array.isArray(f) || f.length !== 4 || !f.every(n => typeof n === "number" && isFinite(n))) return "";
  const [x, y, w, h] = f.map(n => Math.min(100, Math.max(0, n)));
  if (w <= 0 || h <= 0) return "";
  return `<i class="focusbox" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></i>`;
}
function mediaHTML(m){
  if (!m || typeof m !== "object") return "";
  const img = S(m.img), vid = S(m.video);
  if (!img && !vid) return "";
  const dur = fmtDur(m.dur);
  let inner;
  if (vid){
    const attrs = RM ? "controls muted playsinline" : "autoplay muted loop playsinline";
    inner = `<video src="${esc(vid)}" ${img ? `poster="${esc(img)}" ` : ""}${attrs} preload="metadata" data-fallback="${esc(img)}"></video>`;
  } else {
    inner = `<img src="${esc(img)}" alt="" loading="lazy">`;
  }
  return `<div class="media">${inner}${focusBox(m.focus)}${dur ? `<span class="dur">${dur}</span>` : ""}</div>`;
}
function keysHTML(keys){
  const ks = A(keys).filter(k => typeof k === "string" && k);
  return ks.length ? `<div class="keys">${ks.map(k => `<kbd>${esc(k)}</kbd>`).join("")}</div>` : "";
}

document.addEventListener("error", e => {
  const el = e.target;
  if (!(el instanceof Element)) return;
  const box = el.closest(".media");
  if (!box) return;
  if (el.tagName === "VIDEO"){
    const fb = el.getAttribute("data-fallback");
    if (fb && !box.querySelector("img")){
      const im = new Image();
      im.src = fb; im.alt = ""; im.loading = "lazy";
      el.replaceWith(im);
      return;
    }
  }
  if (el.tagName === "VIDEO" || el.tagName === "IMG"){
    const src = el.currentSrc || el.src || "";
    const tail = src.split("/").pop() || "media";
    const ph = document.createElement("div");
    ph.className = "nosignal";
    ph.title = tail;
    ph.textContent = "no signal";
    el.replaceWith(ph);
  }
}, true);

function decisionHTML(a){
  if (!a) return "";
  const bits = [];
  const pick = A(a.pick).map(S).filter(Boolean);
  const st = S(a.status);
  if (st === "answered") bits.push(`<span class="dec dec-done">decided${pick.length ? ": " + esc(pick.join(" + ")) : ""}</span>`);
  else if (st === "later") bits.push(`<span class="dec dec-park">parked${pick.length ? " (leaning " + esc(pick.join(" + ")) + ")" : ""}</span>`);
  if (S(a.note).trim()) bits.push(`<span class="dec dec-note">note on file</span>`);
  const at = fmtAt(a.at);
  if (at) bits.push(`<span class="dec-at">${at}</span>`);
  return bits.length ? `<div class="decision">${bits.join("")}</div>` : "";
}

function optionHTML(card, o){
  const key = S(o.key) || "?";
  const rec = o.rec === true;
  const picked = pickSetOf(card.id).has(key.toUpperCase());
  const adds = S(o.adds), cons = S(o.cons);
  return `<article class="opt${picked ? " picked" : ""}${rec ? " recommended" : ""}" data-key="${esc(key)}" tabindex="0" role="button" aria-pressed="${picked}">
    <div class="opt-head">
      <span class="opt-key">${esc(key)}</span>
      <h3>${esc(S(o.name) || key)}</h3>
      ${rec ? `<span class="rec">recommended</span>` : ""}
    </div>
    ${S(o.rule) ? `<p class="rule">${esc(S(o.rule))}</p>` : ""}
    ${keysHTML(o.keys)}
    ${mediaHTML(o)}
    ${(adds || cons) ? `<div class="delta">
      ${adds ? `<div class="adds"><b>+</b><span>${esc(adds)}</span></div>` : ""}
      ${cons ? `<div class="cons"><b>-</b><span>${esc(cons)}</span></div>` : ""}
    </div>` : ""}
  </article>`;
}

function cardHTML(card){
  const a = answerFor(card.id);
  const link = S(card.link);
  const tag = S(card.tag) || card.id;
  let html = `<article class="card" data-id="${esc(card.id)}">
  <header class="card-head">
    <div class="head-row">
      ${/^https?:\/\//.test(link)
        ? `<a class="tag" href="${esc(link)}" target="_blank" rel="noopener">${esc(tag)}</a>`
        : `<span class="tag">${esc(tag)}</span>`}
      ${card.multi === true ? `<span class="multi">multi: combine freely</span>` : ""}
    </div>
    <h1>${esc(S(card.title) || card.id)}</h1>
    ${S(card.visible) ? `<div class="visible"><span>screen</span>${esc(S(card.visible))}</div>` : ""}
    ${decisionHTML(a)}
  </header>`;

  const now = card.now && typeof card.now === "object" ? card.now : null;
  html += `<section class="now">
    <div class="sec-label">now</div>
    ${S(card.today) ? `<p class="today">${esc(S(card.today))}</p>` : ""}
    ${now ? keysHTML(now.keys) + mediaHTML(now) : ""}
    ${now && S(now.caption) ? `<p class="caption">${esc(S(now.caption))}</p>` : ""}
  </section>`;

  const opts = A(card.options).filter(o => o && typeof o === "object");
  if (opts.length){
    html += `<section class="options">${opts.map(o => optionHTML(card, o)).join("")}</section>`;
  }

  const r = card.result;
  if (r && typeof r === "object" && (S(r.title) || S(r.caption) || S(r.img) || S(r.video))){
    html += `<section class="result">
      <div class="sec-label">${esc(S(r.title) || "after")}</div>
      ${mediaHTML(r)}
      ${S(r.caption) ? `<p class="caption">${esc(S(r.caption))}</p>` : ""}
    </section>`;
  }

  const tri = [["why", S(card.why)], ["elsewhere", S(card.elsewhere)], ["unchanged", S(card.unchanged)]].filter(x => x[1]);
  if (tri.length){
    html += `<section class="triptych">${tri.map(([l, t]) =>
      `<div class="tri"><div class="sec-label">${l}</div><p>${esc(t)}</p></div>`).join("")}</section>`;
  }
  return html + `</article>`;
}

function qItemHTML(c){
  const a = answerFor(c.id);
  const st = a ? S(a.status) : "";
  const pick = a ? A(a.pick).map(S).filter(Boolean) : [];
  let mk = "";
  if (st === "answered") mk = `<span class="q-mk mk-dec">${esc(pick.join("+") || "done")}</span>`;
  else if (st === "later" || (a && S(a.note).trim())) mk = `<span class="q-mk mk-park">parked</span>`;
  return `<div class="q-item${c.id === state.activeId ? " active" : ""}" data-id="${esc(c.id)}">
    <span class="q-tag">${esc(S(c.tag) || c.id)}</span>
    <span class="q-title">${esc(S(c.title) || c.id)}</span>${mk}
  </div>`;
}

function renderQueue(){
  const g = groupsOf();
  let html = `<div class="q-head">queue</div>`;
  const sec = (label, items) => items.length
    ? `<div class="q-sec">${label} <span class="q-count">${items.length}</span></div>` + items.map(qItemHTML).join("")
    : "";
  html += sec("open", g.open) + sec("parked", g.parked) + sec("decided", g.decided);
  if (!state.cards.length && !state.broken.length) html += `<div class="q-empty">desk clear</div>`;
  if (state.broken.length){
    html += `<div class="q-sec warn">unreadable <span class="q-count">${state.broken.length}</span></div>`;
    html += state.broken.map(b =>
      `<div class="q-bad"><span class="q-tag">${esc(S(b.id))}</span> <span class="prob">${esc(S(b.problem) || "cannot read")}</span></div>`).join("");
  }
  $("#queue").innerHTML = html;
  $("#c-open").textContent = g.open.length;
  $("#c-park").textContent = g.parked.length;
  $("#c-dec").textContent = g.decided.length;
  $("#c-bad").textContent = state.broken.length;
  $("#c-bad-wrap").hidden = !state.broken.length;
}

function renderStage(card){
  $("#stage").innerHTML = card ? cardHTML(card) : `<div class="empty">desk clear - nothing waiting for a decision</div>`;
}

function renderStatusline(){
  const order = displayOrder();
  const i = order.indexOf(state.activeId);
  const card = cardById(state.activeId);
  $("#st-pos").textContent = card ? `${S(card.tag) || card.id} - ${i + 1} of ${order.length}` : "nothing on the desk";
  $("#st-sync").textContent = state.lastSync ? `synced ${fmtClock(state.lastSync)}` : "";
}

function render(){
  renderQueue();
  const card = cardById(state.activeId);
  const fp = JSON.stringify([card || null, card ? answerFor(card.id) : null]);
  if (fp !== state.fp){
    state.fp = fp;
    renderStage(card);
  }
  syncNoteBar(card);
  renderStatusline();
}

/* note bar: one persistent textarea, never re-rendered, so a note in progress survives polls */
const noteEl = $("#note");

function getDraft(id){
  let d = state.drafts.get(id);
  if (!d){
    d = {text: S(answerFor(id) && answerFor(id).note), dirty: false, savedAt: 0, timer: 0};
    state.drafts.set(id, d);
  }
  return d;
}
function syncNoteBar(card){
  if (!card){
    noteEl.value = "";
    noteEl.disabled = true;
    $("#notestate").textContent = "";
    return;
  }
  noteEl.disabled = false;
  const d = getDraft(card.id);
  if (noteEl.dataset.cardId !== card.id){
    if (document.activeElement === noteEl) noteEl.blur();
    noteEl.dataset.cardId = card.id;
    noteEl.value = d.text;
  } else if (document.activeElement !== noteEl){
    noteEl.value = d.text;
  }
  updateNoteState(d);
}
function updateNoteState(d){
  $("#notestate").textContent = d.dirty ? "unsaved" : (d.savedAt ? "saved " + fmtClock(d.savedAt) : "");
}

noteEl.addEventListener("input", () => {
  const card = cardById(state.activeId);
  if (!card) return;
  const d = getDraft(card.id);
  d.text = noteEl.value;
  d.dirty = true;
  updateNoteState(d);
  clearTimeout(d.timer);
  d.timer = setTimeout(() => saveNote(card.id), 600);
});
noteEl.addEventListener("blur", () => {
  setMode("desk");
  flushNote();
});
noteEl.addEventListener("focus", () => setMode("note"));

async function saveNote(id){
  const d = state.drafts.get(id);
  if (!d) return;
  clearTimeout(d.timer);
  const text = d.text;
  const a = answerFor(id) || {};
  const body = {};
  const pick = A(a.pick).filter(x => typeof x === "string" && x);
  if (pick.length) body.pick = pick;
  const st = S(a.status) || (text.trim() ? "later" : "");
  if (st) body.status = st;
  if (text.trim()) body.note = text;
  if (!Object.keys(body).length){
    d.dirty = false;
    updateNoteState(d);
    return;
  }
  await postAnswer(id, body, () => {
    if (d.text === text){
      d.dirty = false;
      d.savedAt = Date.now();
    }
  });
}
function flushNote(){
  const id = state.activeId;
  const d = id && state.drafts.get(id);
  if (d && d.dirty) saveNote(id);
}
addEventListener("pagehide", flushNote);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) flushNote();
  else poll();
});

async function postAnswer(id, body, after){
  try{
    const r = await fetch("api/answers/" + encodeURIComponent(id), {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
      keepalive: true,
    });
    if (!r.ok) return;
    const doc = await r.json().catch(() => null);
    if (doc && typeof doc === "object") state.answers[id] = doc;
    if (after) after();
    pulse();
    render();
  }catch(_){/* offline: draft stays dirty, next flush retries */}
}
function pulse(){
  const f = $("#deck-footer");
  f.classList.remove("pulse");
  void f.offsetWidth;
  f.classList.add("pulse");
  setTimeout(() => f.classList.remove("pulse"), 900);
}

function commitAnswer(id, patch){
  const card = cardById(id);
  if (!card) return;
  const a = answerFor(id) || {};
  const body = {};
  const pick = patch.pick !== undefined ? patch.pick : A(a.pick).filter(x => typeof x === "string" && x);
  if (pick.length) body.pick = pick;
  body.status = patch.status || S(a.status) || "answered";
  const d = state.drafts.get(id);
  const note = d ? d.text : S(a.note);
  if (note.trim()) body.note = note;
  postAnswer(id, body);
}

function optionsOf(card){
  return A(card && card.options).filter(o => o && typeof o === "object" && keyOf(o));
}
function pressPick(letter){
  const card = cardById(state.activeId);
  if (!card) return;
  const opts = optionsOf(card);
  const cands = opts.filter(o => keyOf(o).startsWith(letter));
  if (!cands.length) return;
  const cur = pickSetOf(card.id);
  let next;
  if (card.multi === true){
    next = new Set(cur);
    const unpicked = cands.find(o => !cur.has(keyOf(o)));
    if (unpicked) next.add(keyOf(unpicked));
    else cands.forEach(o => next.delete(keyOf(o)));
    if (!next.size) next.add(keyOf(cands[0]));
  } else {
    const idx = cands.findIndex(o => cur.has(keyOf(o)));
    next = new Set([keyOf(cands[(idx + 1) % cands.length])]);
  }
  commitAnswer(card.id, {pick: [...next], status: "answered"});
}
function clickPick(id, key){
  const card = cardById(id);
  if (!card) return;
  const cur = pickSetOf(id);
  let next;
  if (card.multi === true){
    next = new Set(cur);
    if (next.has(key)) next.delete(key); else next.add(key);
    if (!next.size) next.add(key);
  } else {
    next = new Set([key]);
  }
  commitAnswer(id, {pick: [...next], status: "answered"});
}
function pressRec(){
  const card = cardById(state.activeId);
  if (!card) return;
  const recs = optionsOf(card).filter(o => o.rec === true).map(keyOf);
  if (recs.length) commitAnswer(card.id, {pick: recs, status: "answered"});
}
function pressPark(){
  const card = cardById(state.activeId);
  if (card) commitAnswer(card.id, {status: "later"});
}

function activate(id){
  if (id === state.activeId) return;
  flushNote();
  state.activeId = id;
  state.fp = "";
  render();
  window.scrollTo(0, 0);
  const el = $(`.q-item[data-id="${CSS.escape(id)}"]`);
  if (el) el.scrollIntoView({block: "nearest"});
}
function move(delta){
  const order = displayOrder();
  if (!order.length) return;
  let i = order.indexOf(state.activeId);
  i = i < 0 ? 0 : Math.min(order.length - 1, Math.max(0, i + delta));
  activate(order[i]);
}

function setMode(m){
  $("#st-mode").textContent = m;
}
function focusNote(){
  if (noteEl.disabled) return;
  noteEl.focus();
  noteEl.setSelectionRange(noteEl.value.length, noteEl.value.length);
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  const typing = t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable);
  if (typing){
    if (e.code === "Escape"){ e.preventDefault(); t.blur(); }
    return;
  }
  switch (e.code){
    case "KeyJ": case "ArrowDown": e.preventDefault(); move(1); break;
    case "KeyK": case "ArrowUp": e.preventDefault(); move(-1); break;
    case "KeyA": pressPick("A"); break;
    case "KeyB": pressPick("B"); break;
    case "KeyC": pressPick("C"); break;
    case "KeyD": pressPick("D"); break;
    case "KeyR": pressRec(); break;
    case "KeyL": pressPark(); break;
    case "KeyN": e.preventDefault(); focusNote(); break;
  }
});

$("#queue").addEventListener("click", e => {
  const item = e.target.closest(".q-item");
  if (item) activate(item.dataset.id);
});
$("#stage").addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (!opt || !state.activeId) return;
  if (e.target.closest("a,video")) return;
  clickPick(state.activeId, S(opt.dataset.key).toUpperCase());
});
$("#stage").addEventListener("keydown", e => {
  const opt = e.target.closest(".opt");
  if (opt && (e.code === "Enter" || e.code === "Space")){
    e.preventDefault();
    clickPick(state.activeId, S(opt.dataset.key).toUpperCase());
  }
});

async function poll(){
  try{
    const h = {};
    if (state.etag) h["If-None-Match"] = state.etag;
    const r = await fetch("api/state", {headers: h, cache: "no-store"});
    if (r.status === 304){
      state.lastSync = Date.now();
      renderStatusline();
      return;
    }
    if (!r.ok) return;
    const tag = r.headers.get("ETag");
    if (tag) state.etag = tag;
    const body = await r.json();
    applyState(body);
  }catch(_){/* keep the desk as is */}
}
function applyState(body){
  state.cards = A(body && body.cards).filter(c => c && typeof c === "object" && S(c.id) && Array.isArray(c.options));
  state.answers = body && body.answers && typeof body.answers === "object" ? body.answers : {};
  state.broken = A(body && body.broken).filter(b => b && typeof b === "object" && S(b.id));
  state.lastSync = Date.now();
  for (const [id, d] of state.drafts){
    if (!d.dirty){
      const note = S(answerFor(id) && answerFor(id).note);
      if (note !== d.text) d.text = note;
    }
  }
  if (!cardById(state.activeId)){
    const g = groupsOf();
    const first = g.open[0] || g.parked[0] || g.decided[0] || null;
    state.activeId = first ? first.id : null;
    state.fp = "";
  }
  render();
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
