<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#222436" media="(prefers-color-scheme: dark)">
<title>Decision Map</title>
<link rel="icon" href="data:,">
<script>if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.search + location.hash)</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root {
  --bg: #ffffff; --dot: #dfe2ec; --surface: #f6f7fb; --raise: #ffffff; --line: #d7dbe8; --line-soft: #e8eaf2;
  --ink: #2a3052; --ink-2: #474f78; --muted: #646d99; --faint: #8f97bb;
  --accent: #2e7de9; --green: #4b7a1e; --green-soft: rgb(75 122 30 / .09); --green-ink: #ffffff;
  --red: #e0305a; --yellow: #94690f; --yellow-soft: rgb(148 105 15 / .10);
  --edge: #c2c7da; --screen: #1b1d2b; --scrim: rgb(255 255 255 / .9);
  --cap-top: #ffffff; --cap-bot: #eef0f6; --cap-side: #c8cee0;
  --shadow: 0 1px 2px rgb(42 48 82 / .06), 0 14px 32px -18px rgb(42 48 82 / .28);
  --sans: "Golos Text", -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #222436; --dot: #30355a; --surface: #1e2030; --raise: #2a2d47; --line: #3b4261; --line-soft: #2f334d;
    --ink: #c8d3f5; --ink-2: #a9b4e0; --muted: #828bb8; --faint: #636da6;
    --accent: #82aaff; --green: #c3e88d; --green-soft: rgb(195 232 141 / .08); --green-ink: #1b1d2b;
    --red: #ff757f; --yellow: #ffc777; --yellow-soft: rgb(255 199 119 / .10);
    --edge: #444a73; --screen: #191a2a; --scrim: rgb(30 32 48 / .92);
    --cap-top: #3b4065; --cap-bot: #2f3352; --cap-side: #15161f;
    --shadow: 0 1px 2px rgb(0 0 0 / .25), 0 18px 40px -20px rgb(0 0 0 / .7);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; font-size: clamp(14px, .62vw, 17px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: inherit; }
code { font: .9em var(--mono); background: var(--line-soft); padding: .05em .3em; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ph, .ph-fill, .ph-bold { line-height: 1; }
kbd { font: 500 .78rem/1 var(--mono); padding: .32em .5em; border-radius: 6px; color: var(--ink-2);
  background: linear-gradient(var(--cap-top), var(--cap-bot)); box-shadow: inset 0 0 0 1px var(--line), 0 1.5px 0 var(--cap-side); white-space: nowrap; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 3); overflow: hidden; }

/* The board */
.board { overflow: hidden; height: 100dvh; }
#grid { position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px); background-size: 28px 28px; }
.tree #grid { display: none; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.tree #world { position: relative; will-change: auto; padding-top: 3.1rem; }

.tile { position: absolute; transition: opacity .5s var(--ease); }
.board .tile:not(.cur) { opacity: .34; }
.board .tile:not(.cur) .side { visibility: hidden; }
.board.overview .tile { cursor: pointer; }
.board.overview .tile .ov { opacity: 1; }
.board.overview .tile:hover .ov .t { color: var(--accent); }
.ov { position: absolute; left: 0; right: 0; top: 0; opacity: 0; pointer-events: none; transition: opacity .4s; font-size: var(--ovf, 100px); padding: .5em .6em;
  display: grid; gap: .15em; }
.board.overview .tile { opacity: 1; }
.board.overview .tile > :not(.ov):not(.edges) { opacity: .75; }
.board.overview .tile :is(.head, .otext, .ann, .side, .keys, .cap-text, .lbl, .chip) { visibility: hidden; }
.board.overview .edges path { stroke-width: 2; }
.board.overview .frame { background: var(--line-soft); box-shadow: inset 0 0 0 2px var(--line); }
.board.overview .frame > * { visibility: hidden; }
.board.overview .edges path.rec, .board.overview .edges path.chosen { stroke-width: 3; }
.board.overview .tile.cur { outline: calc(var(--ovf) * .12) solid var(--accent); outline-offset: calc(var(--ovf) * .3); border-radius: calc(var(--ovf) * .4); }
.ov .tg { font: 500 .72em var(--mono); color: var(--muted); }
.ov .t { font-weight: 600; line-height: 1.2; --lines: 2; }
.ov .st { font-size: .8em; color: var(--muted); font-weight: 600; }
.ov .st.pick { color: var(--green); } .ov .st.later { color: var(--yellow); }

.head { position: absolute; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; font-size: .88rem; color: var(--muted); }
.meta .tag { font: 500 .85rem var(--mono); color: var(--ink-2); text-decoration: none; display: inline-flex; gap: .35em; align-items: center; }
.meta .tag:hover { color: var(--accent); }
.head h1 { margin: .35rem 0 .45rem; font-size: 1.95rem; line-height: 1.18; letter-spacing: -.015em; font-weight: 600; --lines: 2; max-width: 52ch; }
.head .today { margin: 0; color: var(--ink-2); max-width: 82ch; font-size: 1.02rem; --lines: 3; }
.verdict { font-weight: 500; }
.verdict.pick { color: var(--green); } .verdict.later { color: var(--yellow); }

.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edges path { vector-effect: non-scaling-stroke; fill: none; stroke: var(--edge); stroke-width: 1.6; stroke-linecap: round; transition: opacity .45s var(--ease), stroke .3s, stroke-width .3s; }
.edges path.rec { stroke: var(--green); stroke-width: 2.6; }
.edges path.chosen { stroke: var(--green); stroke-width: 3.6; opacity: 1; }
.edges path.fade { opacity: .22; }
.edges path.parked { stroke-dasharray: 2 7; opacity: .7; }
.edges path.res { stroke-width: 1.4; }

.node { position: absolute; }
.side .node { position: static; }
.lbl { display: inline-flex; align-items: baseline; gap: .6rem; font-weight: 600; font-size: .95rem; margin-bottom: .5rem; }
.lbl.now { color: var(--red); }
.lbl.after { color: var(--green); }
.lbl .parked { color: var(--yellow); font-weight: 500; display: none; }
.tile.is-later .lbl .parked { display: inline; }
.frame { position: relative; display: block; width: 100%; aspect-ratio: 1.78; border-radius: 10px; background: var(--screen); overflow: hidden;
  box-shadow: var(--shadow), inset 0 0 0 1px rgb(255 255 255 / .06); transition: transform .35s var(--ease), box-shadow .35s; }
.frame img, .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.frame:hover { transform: translateY(-2px); }
.frame:active { transform: scale(.99); }
.root .frame { box-shadow: var(--shadow), 0 0 0 1.5px color-mix(in srgb, var(--red) 55%, transparent); }
.chip { position: absolute; right: .5rem; bottom: .5rem; display: inline-flex; align-items: center; gap: .35em; font: 500 .75rem var(--mono);
  color: #e6ebff; background: rgb(20 21 34 / .78); padding: .3em .55em; border-radius: 6px; backdrop-filter: blur(6px); }
.cap-text { margin: .65rem 0 0; color: var(--ink-2); font-size: .92rem; --lines: 4; }
.keys { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .55rem; }
.rootbox { padding: 1rem 1.1rem; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--red) 45%, transparent); color: var(--ink-2); }
.rootbox p { margin: 0; --lines: 7; }

.opt { display: grid; grid-template-columns: auto var(--tw, 0) minmax(0, 1fr); column-gap: 1.1rem; align-items: start; }
.opt.noimg { grid-template-columns: auto minmax(0, 1fr); }
.cap { margin-top: calc(var(--ay) - 1.3rem); min-width: 2.6rem; height: 2.6rem; padding: 0 .55rem; border-radius: 8px; display: grid; place-items: center;
  font: 600 1.05rem var(--mono); color: var(--ink);
  background: linear-gradient(var(--cap-top), var(--cap-bot)); box-shadow: inset 0 0 0 1px var(--line), 0 2.5px 0 var(--cap-side);
  transition: transform .15s var(--ease), background .3s, color .3s, box-shadow .3s; }
.opt.noimg .cap { margin-top: 0; }
.cap:hover { transform: translateY(-1px); }
.cap:active, .cap.bump { transform: translateY(2px); box-shadow: inset 0 0 0 1px var(--line), 0 .5px 0 var(--cap-side); }
.opt.rec .cap { box-shadow: inset 0 0 0 1.5px var(--green), 0 2.5px 0 var(--cap-side); }
.opt.chosen .cap { background: var(--green); color: var(--green-ink); box-shadow: 0 2.5px 0 color-mix(in srgb, var(--green) 55%, #000); }
.opt.chosen .frame { box-shadow: var(--shadow), 0 0 0 2.5px var(--green); }
.opt.fade { opacity: .45; transition: opacity .45s var(--ease); }
.opt, .opt.fade:hover { transition: opacity .45s var(--ease); }
.opt.fade:hover { opacity: .9; }
.otext { min-width: 0; }
.oname { font-weight: 600; font-size: 1.08rem; line-height: 1.3; --lines: 2; cursor: pointer; }
.oname:hover { color: var(--accent); }
.badge { display: inline-flex; align-items: center; gap: .3em; font-size: .8rem; font-weight: 500; margin-top: .2rem; }
.badge.rec { color: var(--green); }
.rule { margin: .35rem 0 0; color: var(--ink-2); font-size: .92rem; line-height: 1.45; }
.ann { position: absolute; top: var(--ay); left: calc(-1 * var(--aw) + 4px); width: calc(var(--aw) - 22px); height: 0; font-size: .84rem; line-height: 1.35; }
.ann p { position: absolute; left: 0; right: 0; margin: 0; --lines: 3; }
.ann .adds { bottom: .5rem; color: var(--ink-2); }
.ann .adds b { color: var(--green); font-weight: 600; }
.ann .cons { top: .55rem; color: var(--muted); }
.ann .cons b { font-weight: 600; color: var(--ink-2); }

.side { position: absolute; display: flex; flex-direction: column; gap: 1.2rem; }
.facts { overflow-y: auto; display: grid; gap: 1.15rem; align-content: start; padding-right: .4rem; min-height: 0; flex: 1; overscroll-behavior: contain; }
.facts h3 { margin: 0 0 .25rem; font-size: .86rem; font-weight: 600; color: var(--muted); }
.facts h3.why { color: var(--green); }
.facts p { margin: 0; font-size: .95rem; color: var(--ink-2); }
.result .frame { box-shadow: var(--shadow), 0 0 0 1.5px color-mix(in srgb, var(--green) 50%, transparent); }

#dock { display: grid; gap: .7rem; padding-top: 1rem; border-top: 1px solid var(--line-soft); }
.drow { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem; }
.btn { display: inline-flex; align-items: center; gap: .5rem; height: 2.5rem; padding: 0 .9rem; border-radius: 10px; font-weight: 500; font-size: .93rem;
  background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); transition: transform .15s var(--ease), background .25s, color .25s, box-shadow .25s; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn:hover { box-shadow: inset 0 0 0 1px var(--faint); }
.btn kbd { font-size: .7rem; }
.btn.go { color: var(--green); box-shadow: inset 0 0 0 1.5px var(--green); }
.btn.go.on { background: var(--green); color: var(--green-ink); }
.btn.go.on kbd { display: none; }
.btn[aria-pressed="true"] { color: var(--yellow); background: var(--yellow-soft); box-shadow: inset 0 0 0 1.5px var(--yellow); }
.saved { font-size: .82rem; color: var(--muted); display: inline-flex; align-items: center; gap: .35em; margin-left: auto; }
.saved.err { color: var(--red); }
.notewrap { display: grid; gap: .35rem; }
.notewrap label { font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; }
#note { width: 100%; min-height: 3.2rem; max-height: 14rem; resize: none; font: inherit; font-size: .95rem; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: .6rem .75rem; line-height: 1.45; }
#note::placeholder { color: var(--muted); }
#note:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

/* HUD */
#hud { position: fixed; left: 0; right: 0; bottom: 0; height: 3.6rem; display: flex; align-items: center; gap: 1.5rem; padding: 0 clamp(28px, 2.4vw, 64px);
  font-size: .86rem; color: var(--muted); pointer-events: none; }
#hud > * { pointer-events: auto; }
#mini { display: block; cursor: pointer; }
#mini rect { fill: transparent; stroke: var(--line); stroke-width: 1; rx: 1.5; transition: fill .3s, stroke .3s; }
#mini rect.pick { fill: var(--green); stroke: var(--green); opacity: .7; }
#mini rect.text { fill: var(--muted); stroke: var(--muted); opacity: .6; }
#mini rect.later { fill: var(--yellow); stroke: var(--yellow); opacity: .7; }
#mini rect.cur { stroke: var(--accent); stroke-width: 2; }
#mini .view { fill: none; stroke: var(--accent); stroke-width: 1.5; rx: 2; transition: x .5s var(--ease), y .5s var(--ease); }
#count b { color: var(--ink); font-weight: 600; }
#count.done { color: var(--green); }
.nav { display: flex; align-items: center; gap: .8rem; flex: 1; justify-content: center; min-width: 0; }
.nav button { display: inline-flex; align-items: center; gap: .5rem; max-width: 34ch; min-width: 0; color: var(--muted); }
.nav button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav button:hover { color: var(--ink); }
.nav button:disabled { visibility: hidden; }
.legend { display: flex; gap: .9rem; align-items: center; white-space: nowrap; }
.legend span { display: inline-flex; gap: .35rem; align-items: center; }
#broken { position: fixed; left: clamp(28px, 2.4vw, 64px); bottom: 3.8rem; margin: 0; color: var(--red); font: .8rem/1.4 var(--mono); white-space: pre-wrap; }
#toast { position: fixed; top: 1rem; left: 50%; transform: translate(-50%, -150%); background: var(--raise); color: var(--red); padding: .55rem 1rem; border-radius: 10px;
  box-shadow: var(--shadow); font-size: .9rem; transition: transform .4s var(--ease); z-index: 30; display: flex; gap: .5rem; align-items: center; }
#toast.on { transform: translate(-50%, 0); }
.empty { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: .4rem; color: var(--muted); }
.empty h1 { color: var(--ink); margin: 0; font-size: 1.6rem; font-weight: 600; }

/* A node opened large */
#focus { position: fixed; inset: 0; z-index: 20; background: var(--scrim); backdrop-filter: blur(10px); display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(320px, 30rem); gap: clamp(24px, 2.5vw, 56px); padding: clamp(24px, 3vw, 72px); align-items: center; }
#focus[hidden] { display: none; }
#focus .big { position: relative; width: 100%; max-height: calc(100dvh - 2 * clamp(24px, 3vw, 72px)); display: grid; place-items: center; }
#focus .big .frame { cursor: default; aspect-ratio: var(--ar, 1.78); width: min(100%, calc((100dvh - 2 * clamp(24px, 3vw, 72px)) * var(--ar, 1.78))); }
#focus .big .frame:hover { transform: none; }
#focus .info { display: grid; gap: .9rem; align-content: center; max-height: 100%; overflow-y: auto; }
#focus .ihead { display: flex; gap: .9rem; align-items: center; }
#focus .ihead .cap { margin: 0; }
#focus h2 { margin: 0; font-size: 1.45rem; line-height: 1.25; font-weight: 600; }
#focus .rule, #focus .cap-text { font-size: 1.02rem; -webkit-line-clamp: unset; display: block; }
#focus dl { margin: 0; display: grid; gap: .6rem; }
#focus dt { font-size: .82rem; color: var(--muted); font-weight: 600; }
#focus dt.adds { color: var(--green); }
#focus dd { margin: 0; color: var(--ink-2); }
#focus .steps { display: flex; gap: .4rem; align-items: center; color: var(--muted); font-size: .85rem; flex-wrap: wrap; }
#focus .steps button { padding: .25rem .55rem; border-radius: 8px; font: 500 .85rem var(--mono); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
#focus .steps button.on { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--accent); }
#focus .close { position: absolute; top: 1rem; right: 1rem; }
.fail { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: .6rem; text-align: center; color: #e6ebff; font-size: 1.1rem;
  background: rgb(20 21 34 / .8); backdrop-filter: blur(6px); }
.fail .ph { font-size: 2rem; color: #ff757f; }
.fail a { color: #82aaff; }

/* Phone: the graph becomes a vertical tree */
.tree .tile { position: relative; padding: 1rem 1rem 0; }
.tree .head, .tree .node, .tree .side { position: static; width: auto !important; }
.tree .head h1 { font-size: 1.45rem; }
.tree .root { margin: 1.2rem 0 0; }
.tree .opts { position: relative; display: grid; gap: 1.6rem; padding: 2rem 0 .4rem 1.75rem; }
.tree .opt { grid-template-columns: auto minmax(0, 1fr); column-gap: .8rem; }
.tree .opt .frame { grid-column: 2; grid-row: 1; }
.tree .opt .cap { margin-top: 0; grid-row: 1; }
.tree .opt .otext { grid-column: 2; margin-top: .65rem; }
.tree .opt.noimg .otext { margin-top: 0; grid-row: 1; }
.tree .ann { position: static; width: auto; height: auto; grid-column: 2; margin-top: .5rem; display: grid; gap: .25rem; }
.tree .ann p { position: static; }
.tree .rule { --lines: 99; }
.tree .side { margin-top: 1.4rem; }
.tree .facts { overflow: visible; }
.tree #dock { position: sticky; bottom: 0; background: var(--bg); margin: 0 -1rem; padding: .8rem 1rem calc(.8rem + env(safe-area-inset-bottom)); }
.tree #hud { position: fixed; top: 0; bottom: auto; height: 3.1rem; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); z-index: 5; padding: 0 1rem; gap: .8rem; }
.tree .legend, .tree .nav span, .tree #mini { display: none; }
.tree .nav { justify-content: flex-end; gap: .3rem; }
.tree .nav button { height: 2.2rem; width: 2.4rem; justify-content: center; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
.tree #broken { position: static; padding: 0 1rem; }
.tree #focus { grid-template-columns: 1fr; align-content: start; overflow-y: auto; padding: 3.6rem 1rem 2rem; }
.tree #focus .big .frame { width: 100%; }
.tile.in { animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="grid"></div>
<main id="world"></main>
<div id="hud">
  <svg id="mini" aria-label="Board"></svg>
  <span id="count"></span>
  <div class="nav">
    <button id="prev" type="button"><kbd>K</kbd><i class="ph ph-arrow-left"></i><span></span></button>
    <button id="next" type="button"><span></span><i class="ph ph-arrow-right"></i><kbd>J</kbd></button>
  </div>
  <div class="legend">
    <span><kbd>A</kbd>-<kbd>D</kbd> pick</span>
    <span><kbd>⇧A</kbd> open</span>
    <span><kbd>R</kbd> recommended</span>
    <span><kbd>L</kbd> park</span>
    <span><kbd>N</kbd> note</span>
    <span><kbd>M</kbd> map</span>
  </div>
</div>
<pre id="broken" hidden></pre>
<div id="toast" role="status"><i class="ph ph-plugs"></i>Desk server is not answering</div>
<section id="focus" hidden aria-modal="true" role="dialog"></section>

<div id="dock" hidden>
  <div class="drow">
    <button class="btn go" id="rec" type="button"></button>
    <button class="btn" id="later" type="button" aria-pressed="false"><i class="ph ph-clock"></i>Park<kbd>L</kbd></button>
    <span class="saved" id="saved" aria-live="polite"></span>
  </div>
  <div class="notewrap">
    <label for="note"><span>Note</span><span><kbd>N</kbd></span></label>
    <textarea id="note" rows="2" placeholder="Your own option, a question or a correction. Dictation works."></textarea>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const SVG = 'http://www.w3.org/2000/svg';
function h(tag, attrs, ...kids) {
  const el = tag.startsWith('svg:') ? document.createElementNS(SVG, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k);
  return el;
}
const icon = (n, fill) => h('i', { class: (fill ? 'ph-fill ph-' : 'ph ph-') + n });
const arr = v => Array.isArray(v) ? v : [];
const clamp = (lo, v, hi) => Math.max(lo, Math.min(hi, v));
const fmt = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const time = iso => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const answered = a => !!a && (a.status === 'later' || arr(a.pick).length > 0 || !!(a.note || '').trim());
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const inline = t => String(t || '').split('`').map((p, i) => i % 2 ? h('code', { text: p }) : p);
const opts = c => arr(c?.options).filter(o => o && typeof o === 'object');
const recKeys = c => opts(c).filter(o => o.rec).map(o => String(o.key));
const media = m => m && (m.img || m.video) ? m : null;

const S = { cards: [], byId: {}, answers: {}, broken: [], cur: null, etag: null, loaded: false,
  pending: {}, timers: {}, seq: {}, saveState: {}, tiles: {}, sigs: {}, orderSig: '', dirty: false,
  mode: '', cam: { x: 0, y: 0, s: 1 }, raf: 0, overview: false, focus: null, W: 0, H: 0, G: 0, cols: 1 };

const dock = $('#dock'), note = $('#note'), world = $('#world');
const noteFocused = () => document.activeElement === note;
const idx = id => S.cards.findIndex(c => c.id === id);
const neighbour = d => S.cards[idx(S.cur) + d]?.id;

/* ---------- data ---------- */
async function poll() {
  try {
    const r = await fetch('api/state', { headers: S.etag ? { 'If-None-Match': S.etag } : {}, cache: 'no-store' });
    if (r.status !== 304 && !r.ok) throw new Error(r.status);
    $('#toast').classList.remove('on');
    for (const id of Object.keys(S.saveState)) if (S.saveState[id] === 'error') send(id);
    if (r.status === 304) return;
    S.etag = r.headers.get('ETag');
    apply(await r.json());
  } catch { $('#toast').classList.add('on'); }
}

function apply(d) {
  S.cards = arr(d.cards).filter(c => c && c.id);
  S.byId = Object.fromEntries(S.cards.map(c => [c.id, c]));
  S.broken = arr(d.broken);
  for (const [id, a] of Object.entries(d.answers || {})) if (!S.pending[id] && !S.timers[id]) S.answers[id] = a;
  if (!S.loaded || !S.byId[S.cur]) {
    const fromHash = decodeURIComponent(location.hash.slice(1));
    S.cur = S.byId[fromHash] ? fromHash : (S.cards.find(c => !answered(S.answers[c.id])) || S.cards[0] || {}).id || null;
    S.loaded = true;
  }
  const orderSig = S.cards.map(c => c.id).join(',');
  if (orderSig !== S.orderSig || !S.mode) { S.orderSig = orderSig; build(); }
  else for (const c of S.cards) if (JSON.stringify(c) !== S.sigs[c.id]) refreshTile(c);
  paint();
}

/* ---------- layout ---------- */
function geom(c, W, H) {
  const pad = clamp(28, W * .024, 64), gap = clamp(28, W * .024, 64);
  const sideW = clamp(340, W * .2, 540);
  const gw = W - pad * 2 - sideW - gap;
  const headH = clamp(150, H * .15, 230);
  const top = pad + headH, bottom = H - pad - 48;
  const gh = bottom - top;
  const rw = gw * .27;
  const ox = gw * .53, ow = gw - ox;
  const n = Math.max(1, opts(c).length);
  const rowH = Math.min(gh / n, 440);
  const y0 = top + (gh - rowH * n) / 2;
  const tw = Math.min(ow * .48, (rowH - 40) * 1.78);
  const aw = Math.min(330, (ox - rw) * .58);
  return { pad, gap, sideW, gw, gh, top, bottom, headH, rw, ox: pad + ox, ow, rowH, y0, tw, th: tw / 1.78, aw };
}

function tilePos(i) {
  const row = Math.floor(i / S.cols), r = i % S.cols;
  const col = row % 2 ? S.cols - 1 - r : r;
  return { col, row, x: col * (S.W + S.G), y: row * (S.H + S.G) };
}

function build() {
  if (noteFocused()) { S.dirty = true; return; }
  S.dirty = false;
  S.mode = innerWidth >= 1180 && innerHeight >= 680 ? 'board' : 'tree';
  document.body.className = S.mode;
  S.W = innerWidth; S.H = innerHeight; S.G = Math.round(S.W * .14);
  S.cols = Math.max(1, Math.ceil(Math.sqrt(S.cards.length)));
  S.tiles = {}; S.sigs = {};
  dock.hidden = true; document.body.append(dock);
  const list = S.mode === 'board' ? S.cards : S.cards.filter(c => c.id === S.cur);
  world.replaceChildren(...list.map(c => renderTile(c)));
  if (!S.cards.length) world.replaceChildren(h('div', { class: 'empty' }, h('h1', { text: 'No decisions waiting' }),
    h('p', { text: 'When an agent prepares a question, it appears here on its own.' })));
  edgesAll();
  placeDock();
  loadNear();
  renderMini();
  if (S.mode === 'board') { const oc = overviewCam(); world.style.setProperty('--ovf', 14 / oc.s + 'px'); setCam(S.overview ? oc : tileCam(S.cur)); }
  else setCam({ x: 0, y: 0, s: 1 }, true);
}

function refreshTile(c) {
  const old = S.tiles[c.id];
  if (!old) return;
  if (c.id === S.cur && noteFocused()) { S.dirty = true; return; }
  const fresh = renderTile(c);
  if (old.contains(dock)) document.body.append(dock);
  old.replaceWith(fresh);
  edgesAll([c.id]);
  if (c.id === S.cur) placeDock();
  loadNear();
}

function renderTile(c) {
  const i = idx(c.id), board = S.mode === 'board';
  const g = board ? geom(c, S.W, S.H) : null;
  const tile = h('section', { class: 'tile', 'data-id': c.id });
  S.tiles[c.id] = tile;
  S.sigs[c.id] = JSON.stringify(c);
  if (board) {
    const p = tilePos(i);
    Object.assign(tile.style, { left: p.x + 'px', top: p.y + 'px', width: S.W + 'px', height: S.H + 'px' });
    tile.addEventListener('click', e => { if (S.overview) { e.stopPropagation(); exitOverview(c.id); } }, true);
  }
  const now = media(c.now);

  const head = h('header', { class: 'head' },
    h('div', { class: 'meta' },
      c.link ? h('a', { class: 'tag', href: c.link, target: '_blank', rel: 'noopener' }, c.tag || 'issue', icon('arrow-up-right'))
        : c.tag ? h('span', { class: 'tag', text: c.tag }) : null,
      c.visible ? h('span', {}, 'Visible: ', ...inline(c.visible)) : null,
      h('span', { class: 'verdict' })),
    h('h1', { class: 'clamp' }, ...inline(c.title || c.id)),
    now && c.today ? h('p', { class: 'today clamp' }, ...inline(c.today)) : null);
  if (board) Object.assign(head.style, { left: g.pad + 'px', top: g.pad + 'px', width: g.gw + 'px' });

  const root = h('div', { class: 'node root' },
    h('div', { class: 'lbl now' }, 'Now', h('span', { class: 'parked', text: 'Parked' })),
    now ? frame(now, 'now', c) : h('div', { class: 'rootbox' }, h('p', { class: 'clamp' }, ...inline(c.now?.caption || c.today || 'As it is today.'))),
    now ? keysEl(c.now.keys) : null,
    now && c.now.caption ? h('p', { class: 'cap-text clamp' }, ...inline(c.now.caption)) : null);
  if (board) {
    const ry = now ? g.top + g.gh / 2 - g.rw / 1.78 / 2 - 40 : g.top + g.gh / 2 - 90;
    Object.assign(root.style, { left: g.pad + 'px', top: Math.max(g.top, ry) + 'px', width: g.rw + 'px' });
  }

  const optEls = opts(c).map((o, k) => {
    const key = String(o.key ?? '?'), m = media(o);
    const lines = board ? Math.max(2, Math.floor((g.rowH - 24 - 64 - (arr(o.keys).length ? 40 : 0)) / 21)) : 99;
    const ay = m ? (board ? g.th / 2 : 0) : 20;
    const el = h('div', { class: 'node opt' + (m ? '' : ' noimg') + (o.rec ? ' rec' : ''), 'data-key': key,
      style: `--ay:${ay}px;--aw:${board ? g.aw : 0}px;--tw:${board ? g.tw : 0}px` },
      h('button', { class: 'cap', type: 'button', 'aria-label': 'Pick ' + key, text: key, onclick: () => pick(c.id, key) }),
      m ? frame(m, key, c) : null,
      h('div', { class: 'otext' },
        h('span', { class: 'oname clamp', role: 'button', tabindex: 0, onclick: () => openFocus(c.id, key),
          onkeydown: e => { if (e.key === 'Enter') openFocus(c.id, key); } }, ...inline(o.name || key)),
        o.rec ? h('span', { class: 'badge rec' }, icon('star', true), 'Recommended') : null,
        o.rule ? h('p', { class: 'rule clamp', style: `--lines:${lines}` }, ...inline(o.rule)) : null,
        keysEl(o.keys)),
      o.adds || o.cons ? h('div', { class: 'ann' },
        o.adds ? h('p', { class: 'adds clamp' }, h('b', { text: 'Adds ' }), ...inline(o.adds)) : null,
        o.cons ? h('p', { class: 'cons clamp' }, h('b', { text: 'Costs ' }), ...inline(o.cons)) : null) : null);
    if (board) Object.assign(el.style, { left: g.ox + 'px', top: g.y0 + k * g.rowH + 'px', width: g.ow + 'px', height: g.rowH - 24 + 'px' });
    return el;
  });

  const res = media(c.result);
  const facts = [['why', 'Why ' + (recKeys(c).join(' + ') || 'this'), c.why], ['', 'Elsewhere', c.elsewhere], ['', 'Stays the same', c.unchanged]].filter(f => f[2]);
  const side = h('aside', { class: 'side' },
    c.result ? h('div', { class: 'node result' },
      h('div', { class: 'lbl after' }, 'After', c.result.title ? h('span', { style: 'color:var(--ink);font-weight:500' }, ...inline(c.result.title)) : null),
      res ? frame(res, 'result', c) : null,
      c.result.caption ? h('p', { class: 'cap-text clamp', style: '--lines:3' }, ...inline(c.result.caption)) : null) : null,
    facts.length ? h('div', { class: 'facts' }, facts.map(([cls, k, v]) => h('div', {}, h('h3', { class: cls, text: k }), h('p', {}, ...inline(v))))) : h('div', { class: 'facts' }));
  if (board) Object.assign(side.style, { left: S.W - g.pad - g.sideW + 'px', top: g.pad + 'px', width: g.sideW + 'px', height: S.H - g.pad - 48 - g.pad + 'px' });

  const svg = h('svg:svg', { class: 'edges' });
  const status = h('div', { class: 'ov' }, h('span', { class: 'tg', text: c.tag || '' }), h('span', { class: 't clamp' }, ...inline(c.title || c.id)), h('span', { class: 'st' }));
  if (board) tile.append(svg, head, root, ...optEls, side, status);
  else tile.append(head, root, h('div', { class: 'opts' }, svg, ...optEls), side);
  return tile;
}

function keysEl(list) {
  list = arr(list).filter(k => k != null && String(k).trim());
  return list.length ? h('div', { class: 'keys' }, list.map(k => h('kbd', { text: String(k) }))) : null;
}

function frame(m, key, c) {
  const b = h('button', { class: 'frame', type: 'button', 'aria-label': 'Open large', onclick: () => openFocus(c.id, key) });
  if (m.img) b.append(h('img', { 'data-src': m.img, alt: '', decoding: 'async' }));
  else b.append(h('video', { 'data-src': m.video + '#t=0.1', preload: 'metadata', muted: '', playsinline: '' }));
  if (m.video) b.append(h('span', { class: 'chip' }, icon('play', true), m.dur ? fmt(m.dur) : 'Video'));
  return b;
}

function loadNear() {
  const near = new Set([S.cur, neighbour(1), neighbour(-1), neighbour(2)]);
  for (const id of near) {
    const t = S.tiles[id];
    if (t) for (const el of t.querySelectorAll('[data-src]')) { el.src = el.dataset.src; el.removeAttribute('data-src'); }
  }
}

/* ---------- edges: real SVG paths measured from the laid-out nodes ---------- */
function rel(el, tile) {
  let x = 0, y = 0;
  for (let e = el; e && e !== tile; e = e.offsetParent) { x += e.offsetLeft; y += e.offsetTop; }
  return { x, y, w: el.offsetWidth, h: el.offsetHeight };
}

function fit(ids) {
  if (S.mode !== 'board') return;
  for (const id of ids || Object.keys(S.tiles)) {
    for (const o of S.tiles[id]?.querySelectorAll('.opt') || []) {
      const t = $('.otext', o), r = $('.rule', o);
      if (!r) continue;
      let n = parseInt(r.style.getPropertyValue('--lines')) || 3;
      while (n > 1 && t.offsetTop + t.offsetHeight > o.offsetHeight) r.style.setProperty('--lines', --n);
    }
  }
}

function edgesAll(ids) {
  fit(ids);
  const jobs = [];
  for (const id of ids || Object.keys(S.tiles)) {
    const tile = S.tiles[id], c = S.byId[id];
    if (!tile || !c) continue;
    const svg = $('svg.edges', tile), host = S.mode === 'board' ? tile : $('.opts', tile);
    const rootEl = $('.root .frame, .root .rootbox', tile);
    const a = rel(rootEl, host);
    const ends = [...tile.querySelectorAll('.opt')].map(o => ({ key: o.dataset.key, rec: o.classList.contains('rec'), cap: rel($('.cap', o), host), node: rel(o, host), aw: parseFloat(o.style.getPropertyValue('--aw')) || 0 }));
    const resEl = $('.result .frame', tile);
    jobs.push({ svg, a, ends, res: resEl && S.mode === 'board' ? rel(resEl, host) : null, host });
  }
  for (const { svg, a, ends, res, host } of jobs) {
    const paths = [];
    if (S.mode === 'board') {
      const x1 = a.x + a.w, y1 = a.y + a.h / 2;
      for (const e of ends) {
        const x2 = e.cap.x - 6, y2 = e.cap.y + e.cap.h / 2, xs = x2 - e.aw, dx = (xs - x1) * .55;
        paths.push({ e, d: `M${x1 + 6} ${y1} C${x1 + dx} ${y1} ${xs - dx} ${y2} ${xs} ${y2} L${x2} ${y2}` });
        if (res) {
          const sx = e.node.x + e.node.w + 8, ty = res.y + res.h / 2, ex = res.x - 8, d2 = (ex - sx) * .5;
          paths.push({ e, res: true, d: `M${sx} ${y2} C${sx + d2} ${y2} ${ex - d2} ${ty} ${ex} ${ty}` });
        }
      }
    } else {
      const tx = 8, y1 = 6, r = 12;
      for (const e of ends) {
        const y2 = e.cap.y + e.cap.h / 2, x2 = e.cap.x - 6;
        paths.push({ e, d: `M${tx} ${y1} V${y2 - r} Q${tx} ${y2} ${tx + r} ${y2} H${x2}` });
      }
      svg.setAttribute('width', host.offsetWidth); svg.setAttribute('height', host.offsetHeight);
    }
    paths.sort((p, q) => p.e.rec - q.e.rec);
    if (S.mode === 'board') { svg.setAttribute('width', S.W); svg.setAttribute('height', S.H); }
    svg.replaceChildren(...paths.map(p => h('svg:path', { d: p.d, 'data-key': p.e.key, class: (p.e.rec ? 'rec' : '') + (p.res ? ' res' : '') })));
  }
}

function drawIn(paths, ms = 650, stagger = 0) {
  if (RM.matches) return;
  paths.forEach((p, i) => {
    const L = p.getTotalLength();
    p.style.strokeDasharray = `${L} ${L}`;
    const an = p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: ms, delay: i * stagger, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
    an.onfinish = () => { p.style.strokeDasharray = ''; };
  });
}

/* ---------- camera ---------- */
function tileCam(id) { const p = tilePos(Math.max(0, idx(id))); return { x: p.x + S.W / 2, y: p.y + S.H / 2, s: 1 }; }
function overviewCam() {
  const rows = Math.ceil(S.cards.length / S.cols);
  const w = S.cols * (S.W + S.G) - S.G, hh = rows * (S.H + S.G) - S.G;
  return { x: w / 2, y: hh / 2, s: Math.min(S.W / w, (S.H - 80) / hh) * .94 };
}
function setCam(c, flat) {
  S.cam = { ...c };
  if (flat) { world.style.transform = ''; return; }
  const tx = S.W / 2 - c.x * c.s, ty = S.H / 2 - c.y * c.s;
  world.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${c.s})`;
  const g = $('#grid'), size = Math.max(14, 28 * c.s);
  g.style.backgroundSize = `${size}px ${size}px`;
  g.style.backgroundPosition = `${tx}px ${ty}px`;
  renderView();
}
function fly(to) {
  cancelAnimationFrame(S.raf);
  const from = { ...S.cam };
  if (RM.matches) { setCam(to); return Promise.resolve(); }
  const dist = Math.hypot(to.x - from.x, to.y - from.y) / (S.W + S.G);
  const zooming = Math.abs(to.s - from.s) > .01;
  const ms = zooming ? 750 : Math.min(1150, 560 + dist * 160);
  const dip = zooming ? 0 : Math.min(.32, .1 + dist * .07);
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      const t = Math.min(1, (now - t0) / ms);
      const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const ls = Math.exp(Math.log(from.s) + (Math.log(to.s) - Math.log(from.s)) * e);
      setCam({ x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e, s: ls * (1 - dip * Math.sin(Math.PI * t)) });
      if (t < 1) S.raf = requestAnimationFrame(step); else res();
    };
    S.raf = requestAnimationFrame(step);
  });
}

/* ---------- moving ---------- */
function flushNote() { if (S.timers[S.cur]) send(S.cur); }

function go(id) {
  if (!id || !S.byId[id]) return;
  flushNote();
  closeFocus(true);
  const dir = idx(id) >= idx(S.cur) ? 1 : -1;
  S.cur = id;
  history.replaceState(null, '', '#' + encodeURIComponent(id));
  if (S.mode === 'tree') {
    S.tiles = {};
    document.body.append(dock);
    const t = renderTile(S.byId[id]);
    t.classList.add('in');
    world.replaceChildren(t);
    edgesAll(); placeDock(); paint(); scrollTo({ top: 0 });
    drawIn([...t.querySelectorAll('.edges path')], 520, 70);
    return;
  }
  placeDock(); loadNear(); paint();
  fly(tileCam(id)).then(() => { if (S.cur === id) drawIn([...S.tiles[id].querySelectorAll('.edges path:not(.fade)')], 520, 60); });
}

function placeDock() {
  const t = S.tiles[S.cur];
  if (!t) { dock.hidden = true; return; }
  $('.side', t).append(dock);
  dock.hidden = false;
  note.value = (S.answers[S.cur] || {}).note || '';
  grow();
  for (const id in S.tiles) S.tiles[id].classList.toggle('cur', id === S.cur);
}

function toggleOverview() { S.overview ? exitOverview(S.cur) : enterOverview(); }
function enterOverview() {
  if (S.mode !== 'board' || !S.cards.length) return;
  flushNote(); closeFocus(true); note.blur();
  const oc = overviewCam();
  world.style.setProperty('--ovf', 14 / oc.s + 'px');
  S.overview = true; document.body.classList.add('overview');
  fly(oc);
}
function exitOverview(id) {
  S.overview = false; document.body.classList.remove('overview');
  if (id !== S.cur) { S.cur = id; history.replaceState(null, '', '#' + encodeURIComponent(id)); placeDock(); loadNear(); paint(); }
  setCam({ ...S.cam });
  fly(tileCam(id));
}

/* ---------- answers ---------- */
function save(id, patch, debounce = 0) {
  S.answers[id] = { ...(S.answers[id] || {}), ...patch };
  S.pending[id] = true;
  S.saveState[id] = 'saving';
  clearTimeout(S.timers[id]);
  delete S.timers[id];
  if (debounce) S.timers[id] = setTimeout(() => send(id), debounce);
  else send(id);
  paint();
}

async function send(id, keepalive = false) {
  clearTimeout(S.timers[id]);
  delete S.timers[id];
  const a = S.answers[id] || {};
  const seq = S.seq[id] = (S.seq[id] || 0) + 1;
  const body = { pick: arr(a.pick), note: a.note || '' };
  if (a.status) body.status = a.status;
  try {
    const r = await fetch('api/answers/' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive });
    if (!r.ok) throw new Error(r.status);
    const doc = await r.json();
    if (S.seq[id] === seq && !S.timers[id]) { S.answers[id] = { ...S.answers[id], at: doc.at }; delete S.pending[id]; S.saveState[id] = 'saved'; }
  } catch { if (S.seq[id] === seq) S.saveState[id] = 'error'; }
  paint();
}

function pick(id, key) {
  const c = S.byId[id];
  if (!c) return;
  const before = arr((S.answers[id] || {}).pick);
  let p = before;
  if (c.multi) p = p.includes(key) ? p.filter(k => k !== key) : [...p, key].sort();
  else p = p.includes(key) ? [] : [key];
  const cap = S.tiles[id]?.querySelector(`.opt[data-key="${CSS.escape(key)}"] .cap`);
  if (cap) { cap.classList.add('bump'); setTimeout(() => cap.classList.remove('bump'), 140); }
  commitPick(id, p, before);
}

function commitPick(id, p, before) {
  save(id, { pick: p, status: 'answered' });
  const fresh = p.filter(k => !before.includes(k));
  const t = S.tiles[id];
  if (t && fresh.length) drawIn([...t.querySelectorAll('.edges path')].filter(e => fresh.includes(e.dataset.key)), 700);
}

function pickRec(id) {
  const c = S.byId[id], r = recKeys(c);
  if (!r.length) return;
  const before = arr((S.answers[id] || {}).pick);
  commitPick(id, before.join() === r.join() ? [] : r, before);
}

function later(id) { save(id, { status: (S.answers[id] || {}).status === 'later' ? 'answered' : 'later' }); }

function status(a) {
  a = a || {};
  if (a.status === 'later') return ['later', 'Parked'];
  if (arr(a.pick).length) return ['pick', 'Picked ' + a.pick.join(' + ')];
  if ((a.note || '').trim()) return ['text', 'Note'];
  return ['', 'Waiting'];
}

/* ---------- paint: state onto the graph ---------- */
function paint() {
  let waiting = 0;
  for (const c of S.cards) {
    const a = S.answers[c.id] || {};
    if (!answered(a)) waiting++;
    const t = S.tiles[c.id];
    if (!t) continue;
    const p = arr(a.pick), parked = a.status === 'later';
    t.classList.toggle('is-later', parked);
    for (const o of t.querySelectorAll('.opt')) {
      o.classList.toggle('chosen', p.includes(o.dataset.key));
      o.classList.toggle('fade', (p.length > 0 && !p.includes(o.dataset.key)) || parked);
    }
    for (const e of t.querySelectorAll('.edges path')) {
      e.classList.toggle('chosen', p.includes(e.dataset.key) && !parked);
      e.classList.toggle('fade', p.length > 0 && !p.includes(e.dataset.key));
      e.classList.toggle('parked', parked);
    }
    const [kind, text] = status(a);
    const v = $('.verdict', t);
    v.className = 'verdict ' + kind; v.textContent = kind ? text : '';
    const st = $('.ov .st', t);
    if (st) { st.className = 'st ' + kind; st.textContent = kind ? text : ''; }
  }
  const total = S.cards.length, count = $('#count');
  count.className = total && !waiting ? 'done' : '';
  const pos = S.mode === 'tree' && total ? `${idx(S.cur) + 1} of ${total}, ` : '';
  count.replaceChildren(...(!total ? ['Empty'] : waiting ? [pos, h('b', { text: String(waiting) }), ' waiting'] : [pos, 'All answered. Tell Claude it is done.']));
  const pv = S.byId[neighbour(-1)], nx = S.byId[neighbour(1)];
  $('#prev').disabled = !pv; $('#next').disabled = !nx;
  $('#prev span').textContent = pv ? pv.title || pv.id : '';
  $('#next span').textContent = nx ? nx.title || nx.id : '';
  const broken = $('#broken');
  broken.hidden = !S.broken.length;
  broken.textContent = S.broken.map(b => `Card ${b.id} did not open: ${b.problem}`).join('\n');
  paintMini();
  paintDock();
  if (S.focus) paintFocus();
}

function paintDock() {
  const c = S.byId[S.cur];
  if (!c) return;
  const a = S.answers[c.id] || {}, p = arr(a.pick), r = recKeys(c);
  const rec = $('#rec');
  rec.hidden = !r.length;
  const on = r.length && r.join() === p.join();
  rec.classList.toggle('on', !!on);
  rec.replaceChildren(icon(on ? 'check-circle' : 'check', on), on ? 'Recommended picked' : 'Take ' + r.join(' + '), h('kbd', { text: 'R' }));
  $('#later').setAttribute('aria-pressed', String(a.status === 'later'));
  const st = S.saveState[c.id], sv = $('#saved');
  const key = (st || '') + (a.at || '');
  if (sv.dataset.k !== key) {
    sv.dataset.k = key;
    sv.className = 'saved' + (st === 'error' ? ' err' : '');
    sv.replaceChildren(...(st === 'saving' ? [icon('circle-notch'), 'Saving'] : st === 'error' ? [icon('warning'), 'Not saved, retrying'] : a.at ? [icon('check'), 'Saved ' + time(a.at)] : []));
  }
  if (!noteFocused() && !S.timers[c.id] && note.value !== (a.note || '')) { note.value = a.note || ''; grow(); }
}

/* ---------- minimap: the board in small ---------- */
function renderMini() {
  const m = $('#mini'), n = S.cards.length;
  if (!n) { m.replaceChildren(); return; }
  const rows = Math.ceil(n / S.cols), cw = 11, ch = 6, gap = 2.5;
  m.setAttribute('width', S.cols * (cw + gap)); m.setAttribute('height', rows * (ch + gap));
  m.replaceChildren(...S.cards.map((c, i) => {
    const p = tilePos(i);
    return h('svg:rect', { x: p.col * (cw + gap) + .5, y: p.row * (ch + gap) + .5, width: cw, height: ch, 'data-id': c.id,
      onclick: e => { e.stopPropagation(); S.overview ? exitOverview(c.id) : go(c.id); } }, h('svg:title', { text: (c.tag ? c.tag + '  ' : '') + (c.title || c.id) }));
  }), h('svg:rect', { class: 'view', width: cw + 4, height: ch + 4 }));
  m.onclick = () => toggleOverview();
  paintMini();
}
function paintMini() {
  for (const r of document.querySelectorAll('#mini rect[data-id]')) {
    const [kind] = status(S.answers[r.dataset.id]);
    r.setAttribute('class', kind + (r.dataset.id === S.cur ? ' cur' : ''));
  }
  renderView();
}
function renderView() {
  const v = $('#mini .view');
  if (!v || S.mode !== 'board') { if (v) v.style.display = 'none'; return; }
  const cw = 11, ch = 6, gap = 2.5;
  const fx = (S.cam.x - S.W / 2) / (S.W + S.G), fy = (S.cam.y - S.H / 2) / (S.H + S.G);
  v.style.display = S.overview ? 'none' : '';
  v.setAttribute('x', fx * (cw + gap) - 1.5); v.setAttribute('y', fy * (ch + gap) - 1.5);
}

/* ---------- a node opened large ---------- */
function focusParts(c) {
  const parts = [];
  if (media(c.now) || c.now) parts.push({ key: 'now', label: 'Now', m: media(c.now) });
  for (const o of opts(c)) parts.push({ key: String(o.key), label: String(o.key), m: media(o), o });
  if (c.result) parts.push({ key: 'result', label: 'After', m: media(c.result) });
  return parts;
}

function openFocus(id, key) {
  if (S.overview) return;
  const c = S.byId[id];
  if (!c) return;
  if (id !== S.cur) return go(id);
  const src = S.tiles[id]?.querySelector(key === 'now' ? '.root .frame' : key === 'result' ? '.result .frame' : `.opt[data-key="${CSS.escape(key)}"] .frame`);
  const show = () => { if (src) src.style.viewTransitionName = ''; S.focus = { id, key }; renderFocus(); };
  if (src && document.startViewTransition && !RM.matches && $('#focus').hidden) {
    src.style.viewTransitionName = 'media';
    document.startViewTransition(show);
  } else show();
}

function renderFocus() {
  const f = $('#focus'), { id, key } = S.focus, c = S.byId[id];
  const parts = focusParts(c), part = parts.find(p => p.key === key) || parts[0];
  if (!part) return closeFocus();
  S.focus.key = part.key;
  const o = part.o, m = part.m;
  const big = h('div', { class: 'big' });
  if (m) {
    const fr = h('div', { class: 'frame', style: 'view-transition-name: media' });
    if (m.img) {
      const im = h('img', { src: m.img, alt: '' });
      im.onload = () => fr.style.setProperty('--ar', im.naturalWidth / im.naturalHeight);
      fr.append(im);
    }
    big.append(fr);
    if (m.video) play(fr, m.video, 0);
  } else big.append(h('div', { class: 'rootbox', style: 'max-width:60ch;font-size:1.1rem' }, h('p', {}, ...inline(part.key === 'now' ? (c.now?.caption || c.today) : 'No recording for this option.'))));
  const steps = h('div', { class: 'steps' }, parts.map(p => h('button', { type: 'button', class: p.key === part.key ? 'on' : '', text: p.label, onclick: () => { S.focus.key = p.key; renderFocus(); } })),
    h('span', { style: 'margin-left:.4rem' }, h('kbd', { text: '←' }), ' ', h('kbd', { text: '→' })));
  let info;
  if (o) info = [
    h('div', { class: 'ihead' }, h('button', { class: 'cap', type: 'button', text: part.key, onclick: () => pick(id, part.key) }), h('h2', {}, ...inline(o.name || part.key))),
    o.rec ? h('span', { class: 'badge rec' }, icon('star', true), 'Recommended') : null,
    o.rule ? h('p', { class: 'rule' }, ...inline(o.rule)) : null,
    keysEl(o.keys),
    h('dl', {}, o.adds ? [h('dt', { class: 'adds', text: 'Adds' }), h('dd', {}, ...inline(o.adds))] : null, o.cons ? [h('dt', { text: 'Costs' }), h('dd', {}, ...inline(o.cons))] : null),
    h('div', { class: 'drow' }, h('button', { class: 'btn go fpick', type: 'button', onclick: () => pick(id, part.key) }), h('button', { class: 'btn', type: 'button', onclick: () => closeFocus() }, 'Back to the map', h('kbd', { text: 'Esc' })))];
  else {
    const src = part.key === 'now' ? c.now || {} : c.result || {};
    info = [h('div', { class: 'ihead' }, h('h2', { style: `color:var(--${part.key === 'now' ? 'red' : 'green'})` }, part.key === 'now' ? 'Now' : 'After')),
      src.title ? h('p', { class: 'rule', style: 'font-weight:600;color:var(--ink)' }, ...inline(src.title)) : null,
      src.caption ? h('p', { class: 'cap-text' }, ...inline(src.caption)) : null,
      keysEl(src.keys),
      h('div', { class: 'drow' }, h('button', { class: 'btn', type: 'button', onclick: () => closeFocus() }, 'Back to the map', h('kbd', { text: 'Esc' })))];
  }
  f.replaceChildren(big, h('div', { class: 'info' }, steps, ...info));
  f.hidden = false;
  f.onclick = e => { if (e.target === f) closeFocus(); };
  paintFocus();
}

function paintFocus() {
  const b = $('#focus .fpick');
  if (!b || !S.focus) return;
  const on = arr((S.answers[S.focus.id] || {}).pick).includes(S.focus.key);
  b.classList.toggle('on', on);
  b.replaceChildren(icon(on ? 'check-circle' : 'check', on), on ? 'Picked ' + S.focus.key : 'Pick ' + S.focus.key, h('kbd', { text: S.focus.key }));
  const cap = $('#focus .ihead .cap');
  if (cap) cap.style.cssText = on ? 'background:var(--green);color:var(--green-ink)' : '';
}

function closeFocus(instant) {
  if (!S.focus) return;
  const { id, key } = S.focus, f = $('#focus');
  const dst = S.tiles[id]?.querySelector(key === 'now' ? '.root .frame' : key === 'result' ? '.result .frame' : `.opt[data-key="${CSS.escape(key)}"] .frame`);
  const hide = () => { for (const v of f.querySelectorAll('video')) v.pause(); f.hidden = true; f.replaceChildren(); S.focus = null; if (dst) dst.style.viewTransitionName = 'media'; };
  if (!instant && dst && document.startViewTransition && !RM.matches) {
    const vt = document.startViewTransition(hide);
    vt.finished.finally(() => { dst.style.viewTransitionName = ''; });
  } else { hide(); if (dst) dst.style.viewTransitionName = ''; }
}

function play(fr, src, attempt) {
  const v = h('video', { src: attempt ? src + '?r=' + Date.now() : src, controls: '', playsinline: '', autoplay: '', muted: '' });
  v.muted = true;
  v.addEventListener('error', () => {
    v.remove();
    if (attempt < 2) return setTimeout(() => play(fr, src, attempt + 1), 800);
    fr.append(h('div', { class: 'fail' }, icon('video-camera-slash'), 'The screencast did not load.', h('a', { href: src, target: '_blank', rel: 'noopener', text: 'Open the file' })));
  }, { once: true });
  v.addEventListener('loadedmetadata', () => { if (v.videoWidth) fr.style.setProperty('--ar', v.videoWidth / v.videoHeight); });
  v.addEventListener('playing', () => { const im = $('img', fr); if (im) im.style.visibility = 'hidden'; });
  fr.append(v);
  v.play().catch(() => {});
}

function stepFocus(d) {
  const c = S.byId[S.focus.id], parts = focusParts(c);
  const i = parts.findIndex(p => p.key === S.focus.key);
  const n = parts[clamp(0, i + d, parts.length - 1)];
  if (n && n.key !== S.focus.key) { S.focus.key = n.key; renderFocus(); }
}

/* ---------- input ---------- */
function grow() { note.style.height = 'auto'; note.style.height = note.scrollHeight + 2 + 'px'; }
note.addEventListener('input', () => { grow(); save(S.cur, { note: note.value }, 600); });
note.addEventListener('blur', () => { if (S.timers[S.cur]) send(S.cur); if (S.dirty) build(); });
$('#rec').onclick = () => pickRec(S.cur);
$('#later').onclick = () => later(S.cur);
$('#prev').onclick = () => go(neighbour(-1));
$('#next').onclick = () => go(neighbour(1));

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/TEXTAREA|INPUT/.test(document.activeElement?.tagName || '')) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  const c = S.byId[S.cur];
  if (!c) return;
  if (e.key === 'Escape') { if (S.focus) closeFocus(); else if (S.overview) exitOverview(S.cur); return; }
  if (S.focus && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); stepFocus(e.key === 'ArrowLeft' ? -1 : 1); return; }
  if (e.code === 'Space' && !S.focus && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); openFocus(c.id, 'now'); return; }
  const letter = /^Key([A-Z])$/.exec(e.code)?.[1];
  if (!letter) return;
  const opt = opts(c).find(o => String(o.key) === letter);
  if ('ABCD'.includes(letter) && opt) {
    e.preventDefault();
    if (S.overview) return;
    if (e.shiftKey) { S.focus ? (S.focus.key = letter, renderFocus()) : openFocus(c.id, letter); }
    else pick(c.id, letter);
  }
  else if (letter === 'R') { e.preventDefault(); pickRec(c.id); }
  else if (letter === 'L') { e.preventDefault(); later(c.id); }
  else if (letter === 'N') { e.preventDefault(); closeFocus(true); if (S.overview) exitOverview(S.cur); note.focus(); note.scrollIntoView({ block: 'nearest' }); }
  else if (letter === 'J') { e.preventDefault(); go(neighbour(1)); }
  else if (letter === 'K') { e.preventDefault(); go(neighbour(-1)); }
  else if (letter === 'M') { e.preventDefault(); toggleOverview(); }
});
let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.cards.length || S.mode) { closeFocus(true); build(); paint(); } }, 160); });
addEventListener('pagehide', () => { for (const id of Object.keys(S.timers)) send(id, true); });
addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if (id !== S.cur && S.byId[id]) go(id); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
document.addEventListener('click', e => { if (S.overview && !e.target.closest('.tile, #hud')) exitOverview(S.cur); });

poll();
setInterval(() => { if (!document.hidden) poll(); }, 2000);
</script>
</body>
</html>
